/* ---------- cursos: cada aula tem frase, essencial, explicação longa (opcional), exemplo e 3 perguntas ---------- */
const CURSOS = {
port:{nome:'Português para o concurso',concurso:1,aulas:[
 {id:'port1',t:'Ler e entender um texto',frase:`Para entender um texto, descubra o assunto, a ideia principal e o que o autor quer dizer, sem inventar nada.`,
  ess:[`Leia a pergunta antes do texto: assim você já sabe o que procurar.`,`Ideia principal: o que o texto inteiro defende ou conta.`,`A resposta certa costuma dizer o que o texto diz, com outras palavras.`,`Cuidado com alternativas que exageram ("sempre", "todos") ou inventam.`],
  mais:`Leia o texto uma vez inteiro, sem parar. Depois, leia de novo procurando o trecho que responde à pergunta.\n\nTrês armadilhas comuns: a alternativa traz uma informação que o texto não deu; diz o contrário do texto; ou pega uma parte pequena e diz que é a ideia principal.\n\nPara achar a ideia principal, tente resumir o texto em uma frase sua. Se a sua frase combina com uma alternativa, é um ótimo sinal.`,
  ex:`Texto: "Muita gente acha que ler é chato. Mas, quando encontra o livro certo, não para mais." Ideia principal: o gosto pela leitura depende de encontrar o livro certo.`,
  qs:[{q:`Texto: "A cidade plantou mil árvores neste ano. Nas ruas arborizadas, a temperatura caiu e os moradores passaram a caminhar mais." Segundo o texto, as árvores`,al:[`deixaram as ruas mais frescas e incentivaram caminhadas.`,`acabaram com o trânsito da cidade.`,`foram plantadas há dez anos.`,`deixaram as ruas mais quentes.`],dica:`Procure o que mudou nas ruas com árvores.`,p:`O texto diz que a temperatura caiu e os moradores passaram a caminhar mais.`},
   {q:`Qual é a melhor dica para responder questões de interpretação?`,al:[`Ler a pergunta antes e buscar no texto o trecho da resposta.`,`Responder pelo que você acha, sem voltar ao texto.`,`Escolher sempre a alternativa mais longa.`,`Ler só a primeira linha do texto.`],dica:`A resposta está no texto.`,p:`Saber o que procurar e voltar ao texto evita erros.`},
   {q:`Uma alternativa diz que "todos os moradores adoraram a mudança", mas o texto fala que "muitos moradores gostaram". Essa alternativa`,al:[`exagera o que o texto diz.`,`resume bem o texto.`,`repete o texto.`,`não tem relação com o texto.`],dica:`Compare "todos" com "muitos".`,p:`"Todos" vai além de "muitos": é um exagero (generalização).`}]},
 {id:'port2',t:'Sinônimos, antônimos e sentido das palavras',frase:`Sinônimo tem sentido parecido; antônimo tem sentido contrário. E uma palavra pode ter sentido próprio ou figurado.`,
  ess:[`Sinônimos: rápido e ágil; bonito e belo.`,`Antônimos: rápido e lento; claro e escuro.`,`Sentido próprio (literal): "O copo está cheio de água."`,`Sentido figurado: "Estou cheio de trabalho" (com muito trabalho).`],
  mais:`Na prova aparece muito: "a palavra X pode ser substituída, sem mudar o sentido, por…". Teste cada alternativa no lugar da palavra e leia a frase inteira: a certa mantém o sentido.\n\nO contexto ajuda a descobrir o significado: "Ele ficou exausto depois de correr 10 km". Pelo resto da frase, dá para perceber que exausto é muito cansado.\n\nSentido figurado é quando a palavra sai do significado comum para criar uma imagem: "Aquele chefe é uma fera" não quer dizer que ele é um animal, e sim que é bravo.`,
  ex:`"O servidor foi cordial" = foi educado, gentil (sinônimos). O contrário seria grosseiro (antônimo).`,
  qs:[{q:`Um sinônimo de "exausto" é`,al:[`muito cansado.`,`muito feliz.`,`descansado.`,`animado.`],dica:`Pense em como alguém fica depois de correr muito.`,p:`Exausto = muito cansado.`},
   {q:`O antônimo de "aumentar" é`,al:[`diminuir.`,`crescer.`,`ampliar.`,`somar.`],dica:`Antônimo é o contrário.`,p:`O contrário de aumentar é diminuir.`},
   {q:`Em "Ela tem um coração de ouro", a palavra "ouro" está em sentido`,al:[`figurado: quer dizer que ela é muito boa.`,`próprio: o coração é feito de metal.`,`técnico.`,`científico.`],dica:`O coração não é de metal de verdade.`,p:`É uma imagem: "coração de ouro" = pessoa bondosa.`}]},
 {id:'port3',t:'Pontuação: a vírgula',frase:`A vírgula organiza a frase: separa itens de uma lista, quem é chamado (vocativo) e explicações. Nunca separa o sujeito do verbo.`,
  ess:[`Lista: "Comprei canetas, papéis e clipes."`,`Vocativo: "Maria, traga os documentos."`,`Explicação: "Guaratinguetá, cidade do Vale do Paraíba, tem muitos estudantes."`,`Errado: "Os documentos, chegaram." (separou sujeito e verbo)`],
  mais:`Pense na vírgula como uma pequena pausa que ajuda a entender. Mas cuidado: nem toda pausa da fala vira vírgula na escrita.\n\nNa lista, o último item normalmente vem com "e", sem vírgula antes: "canetas, papéis e clipes".\n\nA explicação sobre alguém ou algo (aposto) fica entre vírgulas: "O prefeito, que assumiu em janeiro, visitou a escola."\n\nRegra de ouro: sujeito e verbo ficam juntos. "O diretor da escola de Guaratinguetá assinou o documento" não leva vírgula entre "Guaratinguetá" e "assinou", mesmo sendo uma frase longa.`,
  ex:`"Ana, por favor, envie o ofício, o relatório e a ata ainda hoje."`,
  qs:[{q:`Qual frase está pontuada corretamente?`,al:[`João, venha aqui, por favor.`,`João venha, aqui por favor.`,`João venha aqui por, favor.`,`João, venha, aqui por favor.`],dica:`O nome de quem é chamado fica separado por vírgula.`,p:`"João" é vocativo, e "por favor" também fica separado.`},
   {q:`Qual frase tem um erro de vírgula?`,al:[`Os funcionários do setor, chegaram cedo.`,`Comprei arroz, feijão e óleo.`,`Pedro, feche a porta.`,`Guaratinguetá, cidade do Vale, é antiga.`],dica:`Procure uma vírgula entre o sujeito e o verbo.`,p:`"Os funcionários do setor" é o sujeito de "chegaram": não pode ter vírgula entre eles.`},
   {q:`Numa lista, antes do último item com "e", normalmente`,al:[`não se usa vírgula.`,`usa-se ponto final.`,`usa-se ponto e vírgula.`,`usam-se duas vírgulas.`],dica:`Exemplo: "canetas, papéis e clipes".`,p:`Antes do "e" que fecha a lista, em geral não vai vírgula.`}]},
 {id:'port4',t:'Classes de palavras',frase:`Cada palavra tem uma função: nomear (substantivo), dar característica (adjetivo), indicar ação (verbo), ligar ideias (conjunção) e outras.`,
  ess:[`Substantivo: nome de coisa, pessoa, lugar ou sentimento: mesa, Ana, cidade, alegria.`,`Adjetivo: dá característica: mesa grande, cidade bonita.`,`Verbo: ação ou estado: correr, estudar, estar, ser.`,`Advérbio: modifica o verbo (tempo, lugar, modo): chegou cedo, falou bem.`],
  mais:`As outras classes: artigo (o, a, um, uma), numeral (dois, primeiro), pronome (eu, ele, este, meu), preposição (de, em, para, com) e conjunção (e, mas, porque, se).\n\nTruque para achar o adjetivo: pergunte "como é?". "A sala é grande": grande diz como é a sala.\n\nPara o advérbio, pergunte ao verbo "quando?", "onde?", "como?": "Ela chegou cedo" (chegou quando? cedo).\n\nA conjunção liga partes da frase e mostra a relação entre elas: "mas" (oposição), "porque" (causa), "portanto" (conclusão), "se" (condição).`,
  ex:`"A nova (adjetivo) secretária (substantivo) chegou (verbo) cedo (advérbio) e (conjunção) organizou (verbo) tudo."`,
  qs:[{q:`Em "A sala é grande", a palavra "grande" é`,al:[`adjetivo.`,`verbo.`,`substantivo.`,`advérbio.`],dica:`Pergunte: como é a sala?`,p:`"Grande" dá uma característica à sala: é adjetivo.`},
   {q:`Em "Ele chegou cedo", a palavra "cedo" indica`,al:[`tempo (advérbio).`,`lugar (substantivo).`,`ação (verbo).`,`característica (adjetivo).`],dica:`Pergunte: chegou quando?`,p:`"Cedo" responde "quando?": advérbio de tempo.`},
   {q:`Em "Estudei, mas não passei", a palavra "mas" indica`,al:[`oposição.`,`causa.`,`tempo.`,`lugar.`],dica:`O resultado foi o contrário do esperado.`,p:`"Mas" é conjunção de oposição.`}]},
 {id:'port5',t:'Concordância verbal e nominal',frase:`Concordar é combinar: o verbo combina com o sujeito, e o adjetivo combina com o substantivo.`,
  ess:[`Verbo com sujeito: "O aluno chegou" / "Os alunos chegaram".`,`Adjetivo com substantivo: "sala limpa" / "salas limpas".`,`"Haver" no sentido de existir fica no singular: "Havia muitas pessoas".`,`"Fazer" indicando tempo fica no singular: "Faz dois anos".`],
  mais:`Para conferir a concordância verbal, ache o sujeito perguntando ao verbo "quem?" ou "o quê?": "Chegaram os documentos". O que chegou? Os documentos (plural), então "chegaram".\n\nQuando o sujeito vem depois do verbo, a frase engana. Coloque na ordem direta: "Faltam dois dias" = "Dois dias faltam".\n\nPegadinhas da VUNESP: "Houve muitos problemas" (haver = existir, singular); "Faz três meses que trabalho aqui" (tempo, singular); "Existem muitos problemas" (existir vai para o plural normalmente).`,
  ex:`Certo: "Havia dez candidatos." Errado: "Haviam dez candidatos."`,
  qs:[{q:`Complete: "___ muitos candidatos na fila."`,al:[`Havia`,`Haviam`,`Houveram`,`Hão`],dica:`"Haver" no sentido de existir fica no singular.`,p:`"Havia muitos candidatos": haver = existir, singular.`},
   {q:`Qual frase está correta?`,al:[`Chegaram os documentos.`,`Chegou os documentos.`,`Os documento chegaram.`,`Chegaram o documento.`],dica:`Coloque na ordem direta: os documentos…`,p:`Os documentos (plural) chegaram (plural).`},
   {q:`Complete: "As salas estão ___."`,al:[`limpas`,`limpa`,`limpo`,`limpos`],dica:`O adjetivo acompanha "salas": feminino e plural.`,p:`Salas (feminino plural) → limpas.`}]},
 {id:'port6',t:'Regência e crase',frase:`Regência é a preposição que o verbo pede. Crase é o "à", a junção da preposição "a" com o artigo "a".`,
  ess:[`"Assistir ao filme" (no sentido de ver) pede "a".`,`"Preferir uma coisa a outra" (sem "mais" e sem "do que").`,`Crase = a + a: "Fui à escola" (fui a + a escola).`,`Teste: troque por palavra masculina. Se virar "ao", tem crase: "Fui ao banco".`],
  mais:`Regências que mais caem: assistir a (ver), obedecer a, chegar a (e não "em"), ir a, preferir… a, simpatizar com, gostar de.\n\nNão há crase antes de palavra masculina (a pé), antes de verbo (a partir de hoje), antes de "você" e "ela" e antes de cidades sem artigo (vou a Brasília; volto de Brasília).\n\nCom hora marcada, há crase: "A reunião é às 14h."\n\nTruque das cidades: "vou a X, volto de X" = sem crase; "vou à X, volto da X" = com crase (vou à Bahia, volto da Bahia).`,
  ex:`"Entreguei o relatório à diretora às 10h." (Teste: ao diretor, ao meio-dia. Então há crase.)`,
  qs:[{q:`Assinale a frase com crase correta.`,al:[`Vou à farmácia.`,`Vou à pé.`,`Começou à chover.`,`Falei à você.`],dica:`Troque por masculino: vou ao mercado.`,p:`"Vou à farmácia" → "vou ao mercado": tem crase.`},
   {q:`Na norma-padrão, o certo é`,al:[`"Assisti ao filme."`,`"Assisti o filme."`,`"Assisti no filme."`,`"Assisti pelo filme."`],dica:`Assistir (ver) pede a preposição "a".`,p:`Assistir, no sentido de ver, pede "a": assistir ao filme.`},
   {q:`Complete: "A reunião começa ___ 14h."`,al:[`às`,`as`,`a`,`há`],dica:`Hora marcada leva crase.`,p:`Com hora marcada usa-se "às": às 14h.`}]},
 {id:'port7',t:'Pronomes e colocação pronominal',frase:`Pronomes substituem ou acompanham nomes. Os pronomes me, te, se, o, a, lhe podem vir antes ou depois do verbo, conforme a regra.`,
  ess:[`Retos (sujeito): eu, tu, ele, nós, vós, eles.`,`Oblíquos (complemento): me, te, se, o, a, lhe, nos.`,`Na norma-padrão, a frase não começa com pronome oblíquo: "Me ajude" → "Ajude-me".`,`Palavras como "não", "nunca" e "que" puxam o pronome para antes: "Não me ligue".`],
  mais:`Pronome antes do verbo se chama próclise ("Não me ligue"). Depois do verbo, com hífen, se chama ênclise ("Ajude-me").\n\nPalavras que "atraem" o pronome para antes do verbo: negativas (não, nunca, ninguém), pronomes relativos (que, quem), alguns advérbios (sempre, já, aqui) e conjunções (quando, se, porque). Exemplo: "Quando me chamaram, eu fui."\n\nNa fala do dia a dia, "Me empresta?" é comum e aceito, mas na prova vale a norma-padrão.`,
  ex:`Certo na norma-padrão: "Avise-me quando chegar." / "Ele não me avisou."`,
  qs:[{q:`Qual frase segue a norma-padrão?`,al:[`Ajude-me com os documentos.`,`Me ajude com os documentos.`,`Ajude me com os documentos.`,`Me ajude-me com os documentos.`],dica:`Na norma-padrão, a frase não começa com pronome oblíquo.`,p:`Começando pelo verbo, o pronome vai depois, com hífen: ajude-me.`},
   {q:`Em "Não me ligue agora", o pronome está antes do verbo porque`,al:[`a palavra "não" atrai o pronome.`,`ele sempre vem antes.`,`a frase é uma pergunta.`,`o verbo está no passado.`],dica:`Palavras negativas puxam o pronome.`,p:`"Não" é palavra atrativa: o pronome vem antes.`},
   {q:`Em "Ana chegou e ela trouxe os papéis", "ela" retoma`,al:[`Ana.`,`os papéis.`,`a chegada.`,`ninguém.`],dica:`O pronome substitui um nome já dito.`,p:`"Ela" substitui Ana, para não repetir o nome.`}]},
 {id:'port8',t:'Conectivos: palavras que ligam ideias',frase:`Conectivos ligam partes do texto e mostram a relação entre elas: oposição, causa, consequência, condição, adição.`,
  ess:[`Oposição: mas, porém, contudo, no entanto.`,`Causa: porque, pois, já que.`,`Consequência ou conclusão: por isso, portanto, logo.`,`Condição: se, caso. Adição: e, além disso, também.`],
  mais:`Na prova aparece: "a palavra X estabelece relação de…" ou "X pode ser substituída, sem mudar o sentido, por…". Teste trocando por outra palavra do mesmo grupo.\n\nExemplo: "Estudou muito, porém não passou." Troque "porém" por "mas": "Estudou muito, mas não passou." O sentido continua: é oposição.\n\nCuidado com "pois": antes do verbo, geralmente indica causa ("Saí cedo, pois tinha prova"); depois do verbo e entre vírgulas, indica conclusão ("Estudou muito; passará, pois, na prova").`,
  ex:`"O sistema caiu; por isso, o atendimento foi feito em papel." (por isso = consequência)`,
  qs:[{q:`Em "Choveu muito, porém o evento aconteceu", "porém" indica`,al:[`oposição.`,`causa.`,`condição.`,`tempo.`],dica:`Troque por "mas".`,p:`"Porém" = "mas": oposição.`},
   {q:`Qual destas palavras indica causa?`,al:[`porque`,`mas`,`portanto`,`se`],dica:`Ela responde à pergunta "por quê?".`,p:`"Porque" introduz a causa.`},
   {q:`Em "Se chover, a feira será adiada", "se" indica`,al:[`condição.`,`oposição.`,`causa.`,`adição.`],dica:`A feira só será adiada caso chova.`,p:`"Se" = "caso": condição.`}]}
]},
mat:{nome:'Matemática para o concurso',concurso:1,aulas:[
 {id:'mat1',t:'As quatro operações e expressões',frase:`Numa expressão, resolva primeiro o que está entre parênteses, depois multiplicação e divisão e, por último, soma e subtração.`,
  ess:[`Ordem: parênteses → multiplicação e divisão → soma e subtração.`,`Exemplo: 2 + 3 × 4 = 2 + 12 = 14 (e não 20).`,`Multiplicação e divisão: da esquerda para a direita.`,`Confira com a operação inversa: 12 ÷ 3 = 4 porque 4 × 3 = 12.`],
  mais:`Muita gente erra 2 + 3 × 4 fazendo 2 + 3 = 5 e 5 × 4 = 20. Mas a multiplicação vem antes: 3 × 4 = 12, e 2 + 12 = 14.\n\nCom parênteses: (2 + 3) × 4 = 5 × 4 = 20. Os parênteses mudam a ordem.\n\nNa prova não pode usar calculadora, então treine contas à mão: arme a conta com unidade embaixo de unidade e confira com a operação inversa.\n\nPalavras que viram conta: "dobro" = × 2; "triplo" = × 3; "metade" = ÷ 2; "terça parte" = ÷ 3.`,
  ex:`(10 − 4) × 2 + 6 ÷ 3 = 6 × 2 + 2 = 12 + 2 = 14`,
  qs:[{q:`Quanto é 5 + 2 × 3?`,al:[`11`,`21`,`10`,`13`],dica:`A multiplicação vem antes da soma.`,p:`2 × 3 = 6; 5 + 6 = 11.`},
   {q:`Quanto é (5 + 2) × 3?`,al:[`21`,`11`,`10`,`17`],dica:`Os parênteses vêm primeiro.`,p:`5 + 2 = 7; 7 × 3 = 21.`},
   {q:`O dobro de 15 mais a metade de 10 é`,al:[`35`,`25`,`30`,`40`],dica:`Dobro = × 2; metade = ÷ 2.`,p:`15 × 2 = 30; 10 ÷ 2 = 5; 30 + 5 = 35.`}]},
 {id:'mat12',t:'Potências e raízes',frase:`Potência é multiplicar um número por ele mesmo várias vezes; raiz quadrada é o caminho de volta.`,
  ess:[`2³ = 2 × 2 × 2 = 8 (o 3 diz quantas vezes o 2 aparece).`,`Quadrado: 5² = 25. Raiz quadrada: √25 = 5.`,`Qualquer número elevado a 1 é ele mesmo; elevado a 0 dá 1.`,`Raízes que mais caem: √4 = 2, √9 = 3, √16 = 4, √25 = 5, √36 = 6, √49 = 7, √64 = 8, √81 = 9, √100 = 10.`],
  mais:`Cuidado com o erro clássico: 2³ não é 2 × 3 = 6. É 2 × 2 × 2 = 8.\n\nPotências de 10: 10² = 100 e 10³ = 1.000. O número de cima diz quantos zeros.\n\nNúmero negativo ao quadrado fica positivo: (−3)² = 9. Mas −3², sem parênteses, é −9, porque o sinal fica de fora.\n\nNa ordem das operações, potências e raízes vêm antes da multiplicação e da soma: 2 + 3² = 2 + 9 = 11.\n\nPara a raiz quadrada, pergunte: "que número vezes ele mesmo dá isso?". √49: 7 × 7 = 49, então √49 = 7.`,
  ex:`3² + √16 = 9 + 4 = 13`,
  qs:[{q:`Quanto é 2⁴ (2 elevado a 4)?`,al:[`16`,`8`,`6`,`24`],dica:`Multiplique o 2 por ele mesmo, 4 vezes.`,p:`2 × 2 × 2 × 2 = 16.`},
   {q:`Quanto é √81?`,al:[`9`,`8`,`40,5`,`18`],dica:`Que número vezes ele mesmo dá 81?`,p:`9 × 9 = 81, então √81 = 9.`},
   {q:`Quanto é 5 + 2²?`,al:[`9`,`49`,`14`,`7`],dica:`A potência vem antes da soma.`,p:`2² = 4; 5 + 4 = 9.`}]},
 {id:'mat2',t:'Frações e números decimais',frase:`Fração é parte de um todo: o número de baixo diz em quantas partes o todo foi dividido, e o de cima, quantas partes foram pegas.`,
  ess:[`3/4: o todo foi dividido em 4 partes e pegamos 3.`,`Fração de uma quantidade: divida pelo de baixo e multiplique pelo de cima. 3/4 de 20 = 20 ÷ 4 × 3 = 15.`,`Decimais: 0,5 = metade = 1/2; 0,25 = 1/4; 0,1 = 1/10.`,`Para somar decimais, alinhe as vírgulas.`],
  mais:`O número de cima é o numerador; o de baixo, o denominador. Quanto maior o denominador, menor cada pedaço: 1/8 de pizza é menor que 1/4.\n\nPara somar frações com o mesmo denominador, some só os de cima: 1/5 + 2/5 = 3/5. Com denominadores diferentes, é preciso deixar todos iguais antes (é aí que entra o MMC).\n\nDecimais aparecem em dinheiro: R$ 2,50 + R$ 1,75. Alinhe as vírgulas: 2,50 + 1,75 = 4,25.\n\nConversões úteis: 1/2 = 0,5 = 50%; 1/4 = 0,25 = 25%; 3/4 = 0,75 = 75%; 1/10 = 0,1 = 10%.`,
  ex:`Um setor tem 30 funcionários, e 2/3 deles fizeram o curso: 30 ÷ 3 = 10; 10 × 2 = 20 funcionários.`,
  qs:[{q:`Quanto é 2/5 de 50?`,al:[`20`,`10`,`25`,`40`],dica:`Divida 50 por 5 e multiplique por 2.`,p:`50 ÷ 5 = 10; 10 × 2 = 20.`},
   {q:`0,25 é o mesmo que`,al:[`1/4`,`1/2`,`2/5`,`1/25`],dica:`Pense em 25 centavos de 1 real.`,p:`0,25 = 25 centavos = um quarto do real.`},
   {q:`Quanto é R$ 3,50 + R$ 2,75?`,al:[`R$ 6,25`,`R$ 5,25`,`R$ 6,75`,`R$ 5,75`],dica:`Some os centavos primeiro: 50 + 75.`,p:`50 + 75 = 125 centavos = R$ 1,25. Então 3 + 2 + 1,25 = R$ 6,25.`}]},
 {id:'mat3',t:'Porcentagem',frase:`Porcentagem é uma parte de 100: 30% quer dizer 30 de cada 100.`,
  ess:[`10%: divida por 10. 10% de 250 = 25.`,`50% é a metade. 25%: divida por 4.`,`Para 30%: faça 10% e multiplique por 3.`,`Desconto de 10%: tire 10% do valor. Aumento de 10%: some 10% ao valor.`],
  mais:`Quase toda porcentagem sai do 10%: ache 10% e vá montando. 15% = 10% + 5% (a metade do 10%). 20% = 10% × 2.\n\nExemplo: 15% de 80. 10% de 80 = 8; 5% = 4; 15% = 8 + 4 = 12.\n\nDesconto: um produto de R$ 200 com 10% de desconto. 10% de 200 = 20; 200 − 20 = R$ 180.\n\nCuidado: aumentar 10% e depois descontar 10% não volta ao valor inicial, porque o desconto é calculado sobre o valor já aumentado.`,
  ex:`Salário de R$ 2.000 com aumento de 5%: 10% = 200; 5% = 100; novo salário = R$ 2.100.`,
  qs:[{q:`Quanto é 10% de 350?`,al:[`35`,`3,5`,`350`,`70`],dica:`Para 10%, divida por 10.`,p:`350 ÷ 10 = 35.`},
   {q:`Quanto é 25% de 80?`,al:[`20`,`25`,`40`,`8`],dica:`25% é um quarto: divida por 4.`,p:`80 ÷ 4 = 20.`},
   {q:`Um produto de R$ 100 teve desconto de 20%. Quanto passou a custar?`,al:[`R$ 80`,`R$ 120`,`R$ 20`,`R$ 98`],dica:`Calcule 20% de 100 e tire do preço.`,p:`20% de 100 = 20; 100 − 20 = R$ 80.`}]},
 {id:'mat4',t:'Razão, proporção e regra de três',frase:`Regra de três resolve problemas em que duas grandezas mudam juntas, sempre na mesma proporção.`,
  ess:[`Diretamente proporcional: uma aumenta e a outra também (mais horas, mais páginas).`,`Inversamente proporcional: uma aumenta e a outra diminui (mais pessoas, menos tempo).`,`Truque: ache quanto vale 1 unidade e multiplique.`,`Confira se o resultado faz sentido.`],
  mais:`Exemplo direto: 3 cadernos custam R$ 15. Quanto custam 5? 1 caderno = 15 ÷ 3 = R$ 5. Então 5 cadernos = 5 × 5 = R$ 25.\n\nExemplo inverso: 4 pessoas pintam uma sala em 6 horas. Quanto tempo 8 pessoas levam? Com o dobro de pessoas, o tempo cai pela metade: 3 horas. Pergunte sempre: mais disso dá mais ou menos daquilo?\n\nRazão é uma divisão que compara: numa turma com 10 meninas e 20 meninos, a razão de meninas para meninos é 10/20 = 1/2 (uma menina para cada dois meninos).`,
  ex:`Um carro faz 12 km com 1 litro. Para 60 km: 60 ÷ 12 = 5 litros.`,
  qs:[{q:`4 canetas custam R$ 8. Quanto custam 10 canetas?`,al:[`R$ 20`,`R$ 16`,`R$ 18`,`R$ 40`],dica:`Quanto custa 1 caneta?`,p:`1 caneta = 8 ÷ 4 = R$ 2; 10 canetas = R$ 20.`},
   {q:`2 pessoas fazem um trabalho em 6 horas. No mesmo ritmo, 4 pessoas fazem em`,al:[`3 horas.`,`12 horas.`,`6 horas.`,`8 horas.`],dica:`Mais pessoas, menos tempo.`,p:`Dobrando as pessoas, o tempo cai pela metade: 3 horas.`},
   {q:`Numa sala há 6 mulheres e 12 homens. A razão de mulheres para homens é`,al:[`1/2`,`2`,`1/3`,`1/6`],dica:`Mulheres ÷ homens = 6 ÷ 12.`,p:`6/12 = 1/2: uma mulher para cada dois homens. (1/3 seria mulheres em relação ao total.)`}]},
 {id:'mat5',t:'MMC e MDC',frase:`MMC é o menor número que aparece na tabuada de todos; MDC é o maior número que divide todos ao mesmo tempo.`,
  ess:[`MMC: quando as coisas "voltam a se encontrar", como ônibus que passam juntos de novo.`,`MDC: quando se quer dividir em partes iguais, do maior tamanho possível.`,`MMC de 4 e 6: tabuada do 4 (4, 8, 12…) e do 6 (6, 12…) → 12.`,`MDC de 12 e 18: divisores comuns 1, 2, 3 e 6 → o maior é 6.`],
  mais:`Como saber qual usar? Se a pergunta fala de algo que se repete e volta a coincidir (remédios em horários, luzes que piscam, ônibus), é MMC. Se fala de cortar, dividir ou montar grupos iguais, sem sobrar e do maior tamanho possível, é MDC.\n\nExemplo de MDC: há 12 canetas azuis e 18 pretas para montar kits iguais, sem sobrar nenhuma, com o maior número de kits. MDC(12, 18) = 6 kits, cada um com 2 azuis e 3 pretas.\n\nCom números pequenos, listar a tabuada (MMC) ou os divisores (MDC) é o jeito mais seguro.`,
  ex:`Um remédio a cada 6 horas e outro a cada 8 horas, tomados juntos às 8h: MMC(6, 8) = 24, então juntos de novo às 8h do dia seguinte.`,
  qs:[{q:`Duas luzes piscam juntas. Uma pisca a cada 4 segundos e a outra a cada 6. Depois de quantos segundos piscam juntas de novo?`,al:[`12`,`24`,`10`,`2`],dica:`Voltar a coincidir pede MMC.`,p:`MMC(4, 6) = 12 segundos.`},
   {q:`Qual é o MDC de 12 e 18?`,al:[`6`,`3`,`36`,`2`],dica:`É o maior número que divide os dois.`,p:`Divisores comuns: 1, 2, 3 e 6. O maior é 6.`},
   {q:`Para dividir 20 balas e 30 pirulitos em saquinhos iguais, sem sobrar e com o maior número de saquinhos possível, usa-se o`,al:[`MDC.`,`MMC.`,`porcentagem.`,`média.`],dica:`Dividir em partes iguais, o maior possível.`,p:`Divisão em grupos iguais sem sobra = MDC (aqui, 10 saquinhos).`}]},
 {id:'mat6',t:'Equações do 1º grau',frase:`Equação é uma conta com um número escondido (x). Para achar o x, faça a mesma operação dos dois lados até ele ficar sozinho.`,
  ess:[`x + 5 = 12 → x = 12 − 5 = 7.`,`3x = 21 → x = 21 ÷ 3 = 7.`,`O que soma de um lado passa subtraindo; o que multiplica passa dividindo.`,`Confira: troque o x pelo valor e veja se a conta fecha.`],
  mais:`Pense numa balança equilibrada: o que você tira de um lado, tira do outro.\n\nExemplo: 2x + 4 = 18. Tire 4 dos dois lados: 2x = 14. Divida os dois lados por 2: x = 7. Conferindo: 2 × 7 + 4 = 18. Certo!\n\nProblemas com palavras: "um número", "a idade de alguém", "o preço" viram x. "O dobro de um número mais 3 é 11" → 2x + 3 = 11 → 2x = 8 → x = 4.\n\nO edital também cita equação do 2º grau e sistemas. Comece dominando a do 1º grau, que é a base de tudo.`,
  ex:`Ana tinha x reais. Ganhou R$ 20 e ficou com R$ 50: x + 20 = 50 → x = 30.`,
  qs:[{q:`Se x + 8 = 15, então x vale`,al:[`7`,`23`,`8`,`15`],dica:`Passe o 8 para o outro lado, subtraindo.`,p:`x = 15 − 8 = 7.`},
   {q:`Se 4x = 28, então x vale`,al:[`7`,`24`,`32`,`112`],dica:`O 4 multiplica: passa dividindo.`,p:`x = 28 ÷ 4 = 7.`},
   {q:`"O dobro de um número mais 6 é 20." Esse número é`,al:[`7`,`13`,`14`,`10`],dica:`Monte: 2x + 6 = 20.`,p:`2x = 14 → x = 7.`}]},
 {id:'mat9',t:'Equação do 2º grau',frase:`A equação do 2º grau tem x² (x ao quadrado) e pode ter até duas respostas. Para achá-las, usa-se a fórmula de Bhaskara.`,
  ess:[`Forma: ax² + bx + c = 0. Exemplo: x² − 5x + 6 = 0 (a = 1, b = −5, c = 6).`,`Delta: Δ = b² − 4 · a · c.`,`x = (−b ± √Δ) ÷ (2 · a): uma resposta com o +, outra com o −.`,`Δ negativo: não há resposta real. Δ = 0: uma resposta só.`],
  mais:`Passo a passo com x² − 5x + 6 = 0:\n\n1) Ache a, b e c: a = 1, b = −5, c = 6.\n2) Calcule o delta: Δ = (−5)² − 4 × 1 × 6 = 25 − 24 = 1.\n3) Tire a raiz do delta: √1 = 1.\n4) x = (5 ± 1) ÷ 2. Com o +: 6 ÷ 2 = 3. Com o −: 4 ÷ 2 = 2.\n\nConfira: 3² − 5 × 3 + 6 = 9 − 15 + 6 = 0. Certo!\n\nAtalho quando falta o c (x² − 4x = 0): coloque o x em evidência: x · (x − 4) = 0, então x = 0 ou x = 4.\n\nAtalho quando falta o b (x² − 9 = 0): x² = 9, então x = 3 ou x = −3.\n\nCuidado com os sinais: (−5)² = 25 (positivo), e −b, quando b = −5, vira +5.`,
  ex:`x² − 9 = 0 → x² = 9 → x = 3 ou x = −3 (porque 3 × 3 = 9 e (−3) × (−3) = 9).`,
  qs:[{q:`Na equação x² − 7x + 10 = 0, os valores de a, b e c são`,al:[`a = 1, b = −7, c = 10.`,`a = 0, b = 7, c = 10.`,`a = 1, b = 7, c = −10.`,`a = 2, b = −7, c = 10.`],dica:`"a" acompanha o x², "b" acompanha o x e "c" é o número sozinho. Olhe os sinais.`,p:`x² tem o número 1 na frente; −7x dá b = −7; o número sozinho é 10.`},
   {q:`Quais são as soluções de x² − 16 = 0?`,al:[`4 e −4`,`16 e −16`,`8 e −8`,`só o 4`],dica:`x² = 16. Que número vezes ele mesmo dá 16?`,p:`x² = 16 → x = 4 ou x = −4, porque (−4) × (−4) também dá 16.`},
   {q:`Em x² − 5x + 6 = 0, o valor de Δ (b² − 4ac) é`,al:[`1`,`49`,`−1`,`11`],dica:`b = −5, então b² = 25. Depois tire 4 × 1 × 6.`,p:`Δ = 25 − 24 = 1.`}]},
 {id:'mat10',t:'Sistemas de equações',frase:`Sistema é quando há duas equações com duas letras (x e y) ao mesmo tempo. A resposta é o par de números que serve nas duas.`,
  ess:[`Exemplo: x + y = 10 e x − y = 2.`,`Método da soma: some as equações para uma letra sumir: 2x = 12 → x = 6.`,`Depois volte numa das equações: 6 + y = 10 → y = 4.`,`Confira nas duas: 6 + 4 = 10 e 6 − 4 = 2.`],
  mais:`Os sistemas aparecem em problemas com duas coisas desconhecidas. Exemplo: "Numa garagem há 10 veículos, entre carros e motos, e 32 rodas. Quantos são os carros?"\n\nMonte: c + m = 10 (veículos) e 4c + 2m = 32 (rodas).\n\nMétodo da substituição: da primeira, m = 10 − c. Coloque na segunda: 4c + 2 · (10 − c) = 32 → 4c + 20 − 2c = 32 → 2c = 12 → c = 6 carros. Então m = 4 motos.\n\nO método da soma funciona bem quando uma letra aparece com sinais opostos, como +y e −y: somando as equações, ela some.\n\nSempre confira o par nas duas equações.`,
  ex:`Ingressos: 3 inteiras e 1 meia custam R$ 70; 1 inteira e 1 meia custam R$ 30. Subtraindo uma da outra: 2 inteiras = R$ 40, então a inteira custa R$ 20 e a meia, R$ 10.`,
  qs:[{q:`No sistema x + y = 8 e x − y = 2, quanto vale x?`,al:[`5`,`3`,`4`,`6`],dica:`Some as duas equações: o y some.`,p:`2x = 10 → x = 5 (e y = 3).`},
   {q:`Num estacionamento há 12 veículos, entre carros e motos. Sendo c o número de carros e m o de motos, a primeira equação é`,al:[`c + m = 12`,`c − m = 12`,`4c + 2m = 12`,`c × m = 12`],dica:`Juntando carros e motos, dá o total de veículos.`,p:`Carros + motos = 12 veículos.`},
   {q:`O par x = 3 e y = 2 é a solução de qual sistema?`,al:[`x + y = 5 e x − y = 1`,`x + y = 6 e x − y = 1`,`x + y = 5 e x − y = 2`,`x + y = 1 e x − y = 5`],dica:`Troque x por 3 e y por 2 nas duas equações.`,p:`3 + 2 = 5 e 3 − 2 = 1: as duas fecham.`}]},
 {id:'mat7',t:'Medidas, área e perímetro',frase:`Perímetro é o contorno (soma dos lados). Área é o espaço de dentro (no retângulo, base × altura).`,
  ess:[`Perímetro de um retângulo de 5 m × 3 m: 5 + 3 + 5 + 3 = 16 m.`,`Área do mesmo retângulo: 5 × 3 = 15 m².`,`Triângulo: área = base × altura ÷ 2.`,`Medidas: 1 m = 100 cm; 1 km = 1.000 m; 1 kg = 1.000 g; 1 L = 1.000 mL.`],
  mais:`Use perímetro para cerca, rodapé e moldura. Use área para piso, pintura, grama e carpete.\n\nÁrea do quadrado: lado × lado. Área do círculo: π × raio × raio (com π ≈ 3,14).\n\nVolume é o espaço que cabe dentro (caixa, piscina): comprimento × largura × altura, em m³. 1 m³ = 1.000 litros.\n\nTeorema de Pitágoras (triângulo retângulo): o lado maior ao quadrado é igual à soma dos quadrados dos outros dois. Exemplo: 3² + 4² = 5² (9 + 16 = 25).`,
  ex:`Uma sala de 4 m × 3 m: piso = 12 m²; rodapé = 4 + 3 + 4 + 3 = 14 m.`,
  qs:[{q:`Quantos metros de cerca são necessários para contornar um terreno retangular de 10 m × 6 m?`,al:[`32 m`,`60 m`,`16 m`,`26 m`],dica:`Contorno = soma de todos os lados.`,p:`10 + 6 + 10 + 6 = 32 m.`},
   {q:`Qual é a área de uma sala de 6 m × 4 m?`,al:[`24 m²`,`20 m²`,`10 m²`,`48 m²`],dica:`Área do retângulo = base × altura.`,p:`6 × 4 = 24 m².`},
   {q:`Quantos metros há em 2,5 km?`,al:[`2.500 m`,`250 m`,`25 m`,`25.000 m`],dica:`1 km = 1.000 m.`,p:`2,5 × 1.000 = 2.500 m.`}]},
 {id:'mat11',t:'Teoremas de Pitágoras e de Tales',frase:`Pitágoras calcula um lado do triângulo retângulo. Tales diz que retas paralelas cortam outras retas em pedaços proporcionais.`,
  ess:[`Triângulo retângulo: tem um ângulo de 90° (um "canto" reto).`,`Pitágoras: hipotenusa² = cateto² + cateto². Exemplo: 5² = 3² + 4².`,`A hipotenusa é o lado maior, de frente para o ângulo reto.`,`Tales: com retas paralelas cortando duas outras retas, os pedaços são proporcionais.`],
  mais:`Pitágoras na prática: uma escada de 5 m está encostada num muro, com o pé a 3 m dele. Até que altura ela chega? 5² = 3² + h² → 25 = 9 + h² → h² = 16 → h = 4 m.\n\nTrincas famosas que poupam conta: 3, 4, 5; 6, 8, 10 (o dobro); 5, 12, 13.\n\nTales: imagine três ruas paralelas cortadas por duas avenidas. Numa avenida, os quarteirões medem 2 e 4; na outra, o primeiro mede 3 e o segundo mede x. Então 2/4 = 3/x → 2x = 12 → x = 6. É uma proporção, resolvida como regra de três.\n\nTales também explica a sombra: um poste e uma pessoa ao sol formam triângulos parecidos. Se uma pessoa de 1,5 m faz sombra de 2 m e o poste faz sombra de 8 m (4 vezes maior), o poste mede 1,5 × 4 = 6 m.`,
  ex:`Triângulo retângulo com catetos 6 e 8: hipotenusa² = 36 + 64 = 100, então a hipotenusa mede 10.`,
  qs:[{q:`Num triângulo retângulo, os catetos medem 3 cm e 4 cm. A hipotenusa mede`,al:[`5 cm`,`7 cm`,`12 cm`,`25 cm`],dica:`Hipotenusa² = 3² + 4² = 9 + 16.`,p:`9 + 16 = 25; √25 = 5 cm.`},
   {q:`Uma escada de 10 m está encostada num muro, com o pé a 6 m dele. A que altura ela toca o muro?`,al:[`8 m`,`4 m`,`16 m`,`12 m`],dica:`A escada é a hipotenusa: 10² = 6² + h².`,p:`100 = 36 + h² → h² = 64 → h = 8 m.`},
   {q:`Pelo teorema de Tales, se 2/4 = 3/x, então x vale`,al:[`6`,`5`,`8`,`1,5`],dica:`Multiplique cruzado: 2 · x = 4 · 3.`,p:`2x = 12 → x = 6.`}]},
 {id:'mat8',t:'Tabelas, gráficos e média',frase:`Para ler um gráfico, comece pelo título, veja o que cada eixo mostra e só então compare os valores.`,
  ess:[`Leia o título, a legenda e a unidade (pessoas, R$, %).`,`Colunas comparam; linha mostra evolução; pizza mostra partes de um todo.`,`Média: some tudo e divida pela quantidade.`,`Exemplo: média de 6, 8 e 10 = 24 ÷ 3 = 8.`],
  mais:`Muitas questões de gráfico são de leitura: "em qual mês houve mais atendimentos?" Basta olhar a coluna mais alta. Outras pedem uma conta simples: diferença entre dois meses, soma ou porcentagem.\n\nAtenção à unidade: "em milhares" quer dizer que 5 significa 5.000.\n\nMédia aritmética: some todos os valores e divida pela quantidade. Se um setor atendeu 20, 30 e 40 pessoas, a média é (20 + 30 + 40) ÷ 3 = 30.\n\nPara descobrir quanto falta para alcançar uma média: média × quantidade = soma necessária.`,
  ex:`Atendimentos: segunda 40, terça 60, quarta 50. Média = 150 ÷ 3 = 50 por dia. O maior foi na terça.`,
  qs:[{q:`Qual é a média de 4, 6 e 8?`,al:[`6`,`18`,`5`,`7`],dica:`Some e divida por 3.`,p:`(4 + 6 + 8) ÷ 3 = 18 ÷ 3 = 6.`},
   {q:`Para mostrar como o número de atendimentos mudou mês a mês, o gráfico mais indicado é o de`,al:[`linha.`,`pizza.`,`nenhum, só texto.`,`setores com um só valor.`],dica:`É uma evolução no tempo.`,p:`O gráfico de linha mostra evolução ao longo do tempo.`},
   {q:`Num gráfico "em milhares de pessoas", a coluna marca 3. Isso significa`,al:[`3.000 pessoas.`,`3 pessoas.`,`300 pessoas.`,`30 pessoas.`],dica:`Milhares = vezes 1.000.`,p:`3 milhares = 3.000.`}]}
]},
adm:{nome:'Administração e Secretariado',aulas:[
 {id:'adm1',t:'O papel do secretário',frase:`O secretário organiza a rotina, cuida das informações e faz a ponte entre as pessoas do trabalho.`,
  ess:[`Organiza agenda, documentos e reuniões.`,`Atende pessoas, por telefone e pessoalmente.`,`Guarda sigilo: o que se sabe no trabalho fica no trabalho.`,`Precisa de organização, educação e iniciativa.`],
  mais:`Pense no secretário como o "centro de controle" do setor. Ele sabe onde está cada documento, quem precisa falar com quem e o que acontece em cada dia da semana.\n\nSigilo é regra de ouro: informações de pessoas, processos e salários não podem ser comentadas fora do trabalho, nem com colegas que não precisam saber.\n\nIniciativa é perceber o que precisa ser feito antes de alguém pedir. Por exemplo: avisar que duas reuniões vão acontecer no mesmo horário.`,
  ex:`Seu chefe tem duas reuniões marcadas no mesmo horário. Em vez de esperar dar problema, você avisa e sugere outro horário para uma delas.`,
  qs:[{q:`Qual destas atitudes mostra sigilo profissional?`,al:[`Não comentar fora do trabalho o salário de um colega.`,`Contar para a família os problemas de um cidadão atendido.`,`Postar nas redes sociais um documento do setor.`,`Deixar processos abertos na mesa no fim do dia.`],dica:`Sigilo é guardar segredo do que se sabe no trabalho.`,p:`Salário e dados pessoais são sigilosos: não se comenta fora do trabalho.`},
   {q:`Avisar o chefe que duas reuniões vão bater no mesmo horário, antes do problema acontecer, é um exemplo de`,al:[`iniciativa.`,`desorganização.`,`falta de sigilo.`,`desobediência.`],dica:`É fazer algo antes de alguém pedir.`,p:`Iniciativa é agir antes do problema acontecer.`},
   {q:`Uma tarefa típica do secretário é`,al:[`organizar a agenda e os documentos do setor.`,`consertar o computador do setor.`,`fazer a limpeza do prédio.`,`dirigir o carro oficial.`],dica:`Pense em organização e informação.`,p:`Organizar agenda e documentos é o centro do trabalho de secretaria.`}]},
 {id:'adm2',t:'Atendimento presencial e por telefone',frase:`Atender bem é receber a pessoa com educação, entender o que ela precisa e dar uma resposta clara.`,
  ess:[`Cumprimente, olhe nos olhos e chame pelo nome.`,`Escute até o fim antes de responder.`,`Se não souber, diga que vai verificar e dê retorno.`,`No telefone: diga o setor e seu nome logo ao atender.`],
  mais:`Um bom atendimento tem três passos: acolher (cumprimentar e mostrar que está disponível), entender (ouvir e perguntar) e resolver (responder ou encaminhar para quem resolve).\n\nNo telefone, a pessoa não vê você, então a voz faz todo o trabalho: fale devagar e com clareza. Se precisar deixar a pessoa esperando, avise e não demore.\n\nAo anotar um recado, escreva: nome de quem ligou, telefone, assunto, dia e hora. Recado sem telefone para retorno não serve.`,
  ex:`"Secretaria de Educação, Ana, bom dia. Em que posso ajudar?"`,
  qs:[{q:`Ao atender o telefone do setor, a melhor forma é`,al:[`"Secretaria de Educação, Ana, bom dia."`,`"Alô?"`,`"Fala."`,`"Quem é?"`],dica:`Quem liga quer saber logo onde ligou e com quem fala.`,p:`Identificar o setor e o próprio nome, com um cumprimento, é o padrão.`},
   {q:`Um recado completo deve ter, no mínimo,`,al:[`nome de quem ligou, telefone, assunto e horário.`,`apenas o nome de quem ligou.`,`apenas o horário da ligação.`,`a opinião de quem anotou.`],dica:`Pense no que o chefe precisa para retornar a ligação.`,p:`Sem telefone e assunto, quem recebe o recado não consegue retornar.`},
   {q:`Se o cidadão pergunta algo que você não sabe, o correto é`,al:[`dizer que vai verificar e dar o retorno.`,`inventar uma resposta para não ficar mal.`,`dizer que não é problema seu.`,`mandar a pessoa procurar na internet.`],dica:`Honestidade e compromisso de retorno.`,p:`É melhor dizer que vai verificar do que dar uma informação errada.`}]},
 {id:'adm3',t:'Comunicação e conflitos',frase:`Comunicar bem é falar com clareza e ouvir com atenção. Nos conflitos, a calma resolve mais do que a força.`,
  ess:[`Fale de forma simples e direta.`,`Ouça sem interromper (escuta ativa).`,`Diante de alguém nervoso: calma, ouvir e buscar solução.`,`Respeite a hierarquia: assuntos do setor vão primeiro ao chefe imediato.`],
  mais:`Escuta ativa é ouvir de verdade: olhar para a pessoa, não interromper e repetir o que entendeu ("Então o documento não chegou, certo?"). A pessoa se sente respeitada e você evita mal-entendidos.\n\nEm um conflito, não leve para o lado pessoal. Geralmente a pessoa está brava com a situação, não com você. Responder no mesmo tom só piora.\n\nHierarquia é a ordem de comando: quem responde a quem. Pular o chefe imediato para reclamar com o chefe dele costuma criar mais problemas.`,
  ex:`Cidadão irritado: "Estou esperando há uma hora!" Você: "Entendo, o senhor esperou muito. Vou ver agora o que aconteceu com seu pedido."`,
  qs:[{q:`Escuta ativa significa`,al:[`ouvir com atenção, sem interromper, e confirmar o que entendeu.`,`ouvir enquanto mexe no celular.`,`interromper para responder mais rápido.`,`falar mais alto que a outra pessoa.`],dica:`"Ativa" é participar de verdade.`,p:`Escuta ativa é prestar atenção total e confirmar o entendimento.`},
   {q:`Um colega discorda de você em voz alta. A melhor atitude é`,al:[`manter a calma e conversar sobre o problema.`,`gritar mais alto para encerrar.`,`espalhar para todos que ele é grosseiro.`,`parar de falar com ele para sempre.`],dica:`Calma e conversa resolvem.`,p:`Manter a calma e tratar do problema, e não da pessoa, ajuda a resolver o conflito.`},
   {q:`Hierarquia, no trabalho, é`,al:[`a ordem de comando: quem responde a quem.`,`o tempo de casa de cada funcionário.`,`o salário de cada um.`,`a amizade entre os colegas.`],dica:`Pense em "quem é o chefe de quem".`,p:`Hierarquia define as relações de comando e de responsabilidade.`}]},
 {id:'adm4',t:'Arquivo: como guardar documentos',frase:`Arquivar é guardar documentos de um jeito que qualquer pessoa consiga encontrar depressa.`,
  ess:[`Corrente: documentos usados com frequência; ficam no setor.`,`Intermediário: usados de vez em quando; aguardam um prazo.`,`Permanente: valor histórico ou de prova; guardados para sempre.`,`Métodos: alfabético (nome), numérico (número), cronológico (data), geográfico (lugar) e por assunto.`],
  mais:`Isso se chama "teoria das três idades". Todo documento começa no arquivo corrente, quando é muito usado. Com o tempo, passa a ser pouco consultado e vai para o intermediário, onde espera o prazo definido numa tabela (a tabela de temporalidade). No fim do prazo, ou é eliminado com autorização, ou vai para o permanente, se tiver valor histórico ou servir de prova.\n\nO método de arquivamento é a regra para ordenar: pelo nome (alfabético), por número (numérico), por data (cronológico), por cidade ou estado (geográfico) ou por assunto (ideográfico). O importante é que todos no setor sigam a mesma regra.`,
  ex:`Fichas de funcionários por nome, de A a Z = método alfabético. Notas fiscais por data = método cronológico.`,
  qs:[{q:`Os documentos usados todo dia no setor ficam no arquivo`,al:[`corrente.`,`permanente.`,`intermediário.`,`histórico.`],dica:`"Corrente" é o que está em uso agora.`,p:`Uso frequente = arquivo corrente.`},
   {q:`Documentos com valor histórico, guardados para sempre, ficam no arquivo`,al:[`permanente.`,`corrente.`,`intermediário.`,`temporário.`],dica:`Para sempre…`,p:`O permanente guarda o que tem valor histórico ou de prova.`},
   {q:`Organizar notas fiscais pela data de emissão é usar o método`,al:[`cronológico.`,`alfabético.`,`geográfico.`,`numérico.`],dica:`"Crono" quer dizer tempo.`,p:`Cronológico vem de "cronos", tempo: ordenar por data.`}]},
 {id:'adm5',t:'Protocolo: o caminho dos documentos',frase:`O protocolo recebe, registra e acompanha os documentos para que nenhum se perca.`,
  ess:[`Recebe o documento e confere se está completo.`,`Registra: dá um número, a data e o assunto.`,`Distribui para o setor certo.`,`Controla a tramitação: por onde o documento passou e onde está agora.`],
  mais:`Imagine um pedido entregue na prefeitura. O protocolo recebe e confere, registra com um número (que o cidadão usa para acompanhar), envia para o setor responsável e anota cada vez que o documento muda de lugar.\n\nQuando um pedido vira processo, com várias folhas e despachos, isso se chama autuação. O número do protocolo é o que permite ao cidadão perguntar "como está meu pedido?" e receber resposta.`,
  ex:`O cidadão recebe um comprovante com o número 2026/0457. Com esse número, qualquer servidor descobre em que setor o pedido está.`,
  qs:[{q:`Dar um número, a data e o assunto a um documento recebido é a etapa de`,al:[`registro.`,`eliminação.`,`arquivamento permanente.`,`digitação.`],dica:`Registrar é anotar oficialmente.`,p:`O registro identifica o documento para ele ser localizado depois.`},
   {q:`Acompanhar por quais setores o documento passou é o controle de`,al:[`tramitação.`,`suprimentos.`,`ponto.`,`estoque.`],dica:`Tramitar é andar de um lugar para outro.`,p:`Tramitação é o caminho do documento dentro da organização.`},
   {q:`Para que serve o número de protocolo entregue ao cidadão?`,al:[`Para acompanhar o andamento do pedido.`,`Para pagar uma taxa extra.`,`Para marcar consulta médica.`,`Para nada, é só formalidade.`],dica:`Pense em "como está meu pedido?".`,p:`Com o número, o cidadão e o servidor localizam o pedido.`}]},
 {id:'adm6',t:'Agenda e economia de materiais',frase:`Uma agenda bem feita evita esquecimentos, e cuidar dos materiais evita desperdício de dinheiro público.`,
  ess:[`Anote compromissos com data, hora, local e assunto.`,`Confirme reuniões um dia antes.`,`Imprima só o necessário e use frente e verso.`,`Desligue os equipamentos no fim do dia e avise defeitos logo.`],
  mais:`A agenda pode ser de papel ou digital (como a Agenda do Google). O importante é anotar tudo assim que marcar e consultar todos os dias. Deixe um intervalo entre compromissos: reuniões costumam atrasar.\n\nEconomia de suprimentos é usar com cuidado papel, tinta, cartuchos e energia. Na repartição pública, isso é dinheiro de todos.\n\nManutenção preventiva é cuidar antes de quebrar: limpar, desligar do jeito certo e avisar quando algo começa a falhar.`,
  ex:`Antes de imprimir um documento de 20 páginas, você verifica se dá para enviar por e-mail.`,
  qs:[{q:`Ao marcar uma reunião na agenda, o mínimo que se deve anotar é`,al:[`data, hora, local e assunto.`,`só o dia.`,`só o nome de quem marcou.`,`a roupa que vai usar.`],dica:`O que você precisa saber para chegar à reunião certa?`,p:`Data, hora, local e assunto evitam confusão.`},
   {q:`Uma atitude de economia de materiais é`,al:[`imprimir frente e verso e só o necessário.`,`imprimir tudo duas vezes, por garantia.`,`deixar o computador ligado no fim de semana.`,`jogar fora canetas que ainda funcionam.`],dica:`Economizar é não desperdiçar.`,p:`Imprimir só o necessário, em frente e verso, economiza papel e tinta.`},
   {q:`Manutenção preventiva é`,al:[`cuidar dos equipamentos antes que quebrem.`,`consertar só depois que quebrar.`,`comprar equipamento novo todo ano.`,`não usar os equipamentos.`],dica:`Prevenir é agir antes.`,p:`Prevenir evita que o equipamento pare de funcionar.`}]},
 {id:'adm7',t:'Redação oficial',frase:`Redação oficial é escrever de forma clara, curta, formal e impessoal, em nome do órgão público.`,
  ess:[`Clareza: qualquer pessoa entende.`,`Concisão: diz o necessário, sem enrolar.`,`Impessoalidade: sem opinião pessoal.`,`Formalidade: norma-padrão, sem gírias.`,`Fechos: "Respeitosamente" (para superiores) e "Atenciosamente" (mesmo nível ou abaixo).`],
  mais:`Quem escreve um documento oficial não fala por si, e sim pelo órgão. Por isso nada de "eu acho" ou de expressões como "vc", "blz", "abraços".\n\nO documento mais comum é o ofício, usado para se comunicar com outros órgãos ou com pessoas. O e-mail também é usado e segue as mesmas regras: assunto claro, texto formal e identificação de quem envia.\n\nA referência que a banca cobra é o Manual de Redação da Presidência da República (3ª edição).`,
  ex:`Errado: "Oi, tudo bem? Manda aí os documentos." Certo: "Solicito o envio dos documentos referentes ao processo nº 457/2026."`,
  qs:[{q:`Qual frase está adequada a um documento oficial?`,al:[`"Solicito o envio dos documentos do processo."`,`"Manda aí os documentos, blz?"`,`"Acho que vocês esqueceram de mandar, né?"`,`"Vc pode mandar logo?"`],dica:`Formal, clara e sem gíria.`,p:`É a única formal, clara e impessoal.`},
   {q:`Para uma autoridade de hierarquia superior, o fecho correto é`,al:[`Respeitosamente,`,`Atenciosamente,`,`Abraços,`,`Valeu,`],dica:`Para quem está acima: respeito.`,p:`"Respeitosamente" é para superiores; "Atenciosamente", para os demais.`},
   {q:`Escrever "eu acho que" num documento oficial fere a`,al:[`impessoalidade.`,`numeração.`,`pontuação.`,`margem.`],dica:`O documento fala pelo órgão, não pela pessoa.`,p:`Opinião pessoal contraria a impessoalidade.`}]},
 {id:'adm8',t:'Princípios e ética no serviço público',frase:`O servidor trabalha para todos: segue a lei, trata todos igual, age com honestidade, é transparente e faz bem feito.`,
  ess:[`Legalidade: só faz o que a lei permite.`,`Impessoalidade: sem favorecer ninguém.`,`Moralidade: honestidade sempre.`,`Publicidade: transparência dos atos.`,`Eficiência: bom resultado, sem desperdício.`],
  mais:`Esses cinco princípios estão no art. 37 da Constituição e formam a palavra LIMPE. Valem para a prefeitura, o estado e a União.\n\nNa prática: furar a fila de um amigo fere a impessoalidade; aceitar presente para agilizar um pedido fere a moralidade; esconder gastos fere a publicidade; deixar processos parados sem motivo fere a eficiência.\n\nÉtica no serviço público é isso no dia a dia: cortesia com o cidadão, sigilo das informações, não usar o cargo em benefício próprio e cuidar do patrimônio público.\n\nOrganização: a administração direta é a própria prefeitura com suas secretarias; a indireta são entidades criadas por ela, como autarquias e empresas públicas.`,
  ex:`Um cidadão oferece dinheiro para "furar a fila" do pedido dele. O servidor ético recusa e segue a ordem de chegada.`,
  qs:[{q:`A palavra que ajuda a lembrar os princípios da administração pública é`,al:[`LIMPE`,`RÁPIDO`,`LUCRO`,`FILA`],dica:`Cinco letras, uma para cada princípio.`,p:`LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência.`},
   {q:`Divulgar os gastos da prefeitura na internet atende ao princípio da`,al:[`publicidade.`,`pessoalidade.`,`sigilo.`,`hierarquia.`],dica:`Tornar público…`,p:`Publicidade é transparência dos atos públicos.`},
   {q:`Aceitar um presente para agilizar o pedido de alguém fere principalmente a`,al:[`moralidade.`,`eficiência.`,`publicidade.`,`hierarquia.`],dica:`Pense em honestidade.`,p:`Moralidade exige honestidade e conduta correta.`}]}
]},
info:{nome:'Informática básica',aulas:[
 {id:'inf1',t:'Arquivos, pastas e área de trabalho',frase:`No computador, tudo é guardado em arquivos, e os arquivos ficam organizados em pastas.`,
  ess:[`Arquivo: um documento, foto, planilha ou música.`,`Pasta: um lugar para agrupar arquivos.`,`Área de trabalho: a tela inicial do Windows.`,`Atalho: um ícone com setinha que abre algo que está em outro lugar.`],
  mais:`Pense num armário: as pastas são as gavetas e os arquivos são os papéis. Uma pasta pode ter outras pastas dentro (subpastas).\n\nNo Windows 11, quem mostra suas pastas é o Explorador de Arquivos (ícone de pasta amarela ou teclas Windows + E).\n\nO atalho não é o arquivo de verdade: é só um caminho até ele. Se você apagar o atalho, o arquivo continua lá. Se apagar o arquivo, o atalho para de funcionar.\n\nO tipo do arquivo aparece nas letras depois do ponto (extensão): .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .pdf, .jpg (foto).`,
  ex:`Pasta "Documentos" > pasta "Concurso" > arquivo "edital.pdf".`,
  qs:[{q:`Para agrupar vários arquivos do mesmo assunto, usamos`,al:[`uma pasta.`,`um atalho.`,`a lixeira.`,`o papel de parede.`],dica:`Pense numa gaveta.`,p:`Pastas servem para organizar e agrupar arquivos.`},
   {q:`Se você apagar um atalho da área de trabalho, o arquivo original`,al:[`continua guardado no lugar dele.`,`é apagado também.`,`vai para o e-mail.`,`fica estragado.`],dica:`O atalho é só um caminho.`,p:`Apagar o atalho não apaga o arquivo.`},
   {q:`Um arquivo terminado em .xlsx foi feito no`,al:[`Excel.`,`Word.`,`PowerPoint.`,`Paint.`],dica:`O "x" de eXcel aparece no começo.`,p:`.xlsx é a extensão do Excel. Word usa .docx e PowerPoint, .pptx.`}]},
 {id:'inf2',t:'Atalhos de teclado que mais caem',frase:`Atalhos são combinações de teclas que fazem tarefas rápido, sem usar o mouse.`,
  ess:[`Ctrl + C: copiar. Ctrl + X: recortar. Ctrl + V: colar.`,`Ctrl + Z: desfazer a última ação.`,`Windows + E: abrir o Explorador de Arquivos.`,`Alt + Tab: alternar entre janelas abertas.`],
  mais:`Copiar (Ctrl + C) mantém o original e faz uma cópia. Recortar (Ctrl + X) tira do lugar para colar em outro. Os dois guardam o conteúdo na área de transferência, um espaço temporário. Colar (Ctrl + V) traz de lá.\n\nCtrl + Z é o "voltar": desfaz o último passo. Errou? Ctrl + Z.\n\nOutros úteis: Windows + D mostra a área de trabalho; Ctrl + P manda imprimir.`,
  ex:`Para mover um parágrafo: selecione, aperte Ctrl + X, clique no novo lugar e aperte Ctrl + V.`,
  qs:[{q:`Para desfazer a última ação, usa-se`,al:[`Ctrl + Z`,`Ctrl + C`,`Ctrl + V`,`Ctrl + X`],dica:`É o atalho de "voltar".`,p:`Ctrl + Z desfaz.`},
   {q:`Para tirar um texto de um lugar e levar para outro, usam-se`,al:[`Ctrl + X e depois Ctrl + V`,`Ctrl + C e depois Ctrl + Z`,`Ctrl + V e depois Ctrl + X`,`Ctrl + Z e depois Ctrl + C`],dica:`Primeiro recorta, depois cola.`,p:`Recortar (Ctrl + X) e colar (Ctrl + V) move o conteúdo.`},
   {q:`O espaço temporário onde fica o que foi copiado ou recortado chama-se`,al:[`área de transferência.`,`lixeira.`,`área de trabalho.`,`barra de tarefas.`],dica:`É de onde o Ctrl + V busca o conteúdo.`,p:`A área de transferência guarda temporariamente o que foi copiado ou recortado.`}]},
 {id:'inf3',t:'Word: formatar um texto',frase:`Formatar é deixar o texto organizado: mudar letra, tamanho, negrito, alinhamento e listas.`,
  ess:[`No Word em português: Ctrl + N = negrito, Ctrl + I = itálico, Ctrl + S = sublinhado.`,`Ctrl + B = salvar (pegadinha comum!).`,`Marcadores fazem listas com bolinhas; numeração, listas com números.`,`Cabeçalho e rodapé aparecem em todas as páginas; ali vai o número da página.`],
  mais:`A guia Página Inicial tem quase tudo de formatação: fonte, tamanho, cor, negrito, alinhamento (esquerda, centro, direita, justificado) e marcadores.\n\nA guia Inserir coloca tabelas, imagens, caixas de texto e números de página. A guia Layout muda margens, orientação (retrato ou paisagem) e colunas.\n\nJustificado é o alinhamento que deixa o texto reto dos dois lados, como em livros e documentos oficiais.\n\nNo Word em inglês os atalhos mudam (Ctrl + B é negrito), mas a prova da VUNESP usa o Office em português.`,
  ex:`Selecione o título e aperte Ctrl + N: ele fica em negrito.`,
  qs:[{q:`No Word em português, Ctrl + N serve para`,al:[`aplicar negrito.`,`abrir um novo documento.`,`salvar o documento.`,`imprimir.`],dica:`N de…`,p:`No Word em português, Ctrl + N aplica negrito.`},
   {q:`No Word em português, o atalho para salvar é`,al:[`Ctrl + B`,`Ctrl + S`,`Ctrl + N`,`Ctrl + V`],dica:`É a pegadinha: não é o S.`,p:`No Word em português, Ctrl + B salva. Ctrl + S é sublinhado.`},
   {q:`O número da página costuma ficar no`,al:[`cabeçalho ou rodapé.`,`meio do texto.`,`título.`,`marcador.`],dica:`É uma área que se repete em todas as páginas.`,p:`Cabeçalho e rodapé se repetem em todas as páginas, por isso ali vai o número.`}]},
 {id:'inf4',t:'Excel: células e fórmulas',frase:`O Excel é uma grande tabela de células. Cada célula tem um endereço, como A1, e pode fazer contas.`,
  ess:[`Coluna = letra (A, B, C). Linha = número (1, 2, 3).`,`Célula = encontro de coluna e linha, como B3.`,`Toda fórmula começa com =.`,`=SOMA(A1:A5) soma de A1 até A5. =MÉDIA(A1:A5) calcula a média.`],
  mais:`Os dois-pontos querem dizer "até": A1:A5 é A1, A2, A3, A4 e A5. O ponto e vírgula quer dizer "e": A1;A5 é só A1 e A5.\n\nContas diretas: =A1+B1 (soma), =A1-B1 (subtração), =A1*B1 (multiplicação, com asterisco) e =A1/B1 (divisão, com barra).\n\nOutras funções que caem: =MÁXIMO (maior valor) e =MÍNIMO (menor valor). O arquivo do Excel se chama pasta de trabalho, e cada aba embaixo é uma planilha.`,
  ex:`Gastos em A1 (100), A2 (50) e A3 (30): =SOMA(A1:A3) mostra 180.`,
  qs:[{q:`Toda fórmula no Excel começa com`,al:[`=`,`#`,`@`,`?`],dica:`É o sinal de igualdade.`,p:`Sem o sinal de igual, o Excel entende como texto, não como conta.`},
   {q:`A fórmula =SOMA(A1:A3) soma`,al:[`A1, A2 e A3.`,`só A1 e A3.`,`A1 três vezes.`,`a coluna A inteira.`],dica:`Os dois-pontos significam "até".`,p:`A1:A3 = de A1 até A3.`},
   {q:`No Excel, o sinal usado para multiplicar é`,al:[`*`,`x`,`÷`,`#`],dica:`É o asterisco.`,p:`Para multiplicar usa-se o asterisco: =A1*B1.`}]},
 {id:'inf5',t:'Excel: gráficos, ordenar e filtrar',frase:`O Excel organiza dados (ordenar e filtrar) e transforma números em gráficos fáceis de entender.`,
  ess:[`Ordenar: coloca em ordem (A a Z, do menor para o maior).`,`Filtrar: mostra só o que você quer ver, sem apagar o resto.`,`Gráfico de colunas: comparar valores.`,`Gráfico de pizza: mostrar partes de um todo.`],
  mais:`Para criar um gráfico: selecione os dados, vá na guia Inserir e escolha o tipo. O Excel desenha na hora.\n\nColunas ou barras servem para comparar (atendimentos de cada mês). Pizza mostra a divisão de um total (quanto do orçamento vai para cada área). Linha mostra evolução no tempo.\n\nO filtro é um "esconder temporário": as linhas que não combinam ficam ocultas, mas continuam lá. Ordenar e filtrar ficam na guia Dados.`,
  ex:`Lista de 200 pedidos: filtre a coluna "Bairro" por "Centro" e veja só os pedidos do Centro.`,
  qs:[{q:`Para mostrar quanto cada área representa do orçamento total, o gráfico mais indicado é o de`,al:[`pizza.`,`linha.`,`dispersão.`,`nenhum, só tabela.`],dica:`Partes de um todo, como fatias.`,p:`A pizza mostra a divisão de um total em partes.`},
   {q:`Filtrar uma planilha`,al:[`mostra só as linhas desejadas, sem apagar as outras.`,`apaga as linhas que não interessam.`,`muda as cores das células.`,`transforma a tabela em gráfico.`],dica:`É um esconder temporário.`,p:`O filtro só oculta; os dados continuam lá.`},
   {q:`Para comparar o número de atendimentos de cada mês, um bom gráfico é o de`,al:[`colunas.`,`pizza com um só valor.`,`texto.`,`nenhum.`],dica:`Barras lado a lado para comparar.`,p:`Colunas facilitam comparar valores lado a lado.`}]},
 {id:'inf6',t:'PowerPoint: apresentações',frase:`O PowerPoint cria apresentações em slides, que podem ter texto, imagens, transições e animações.`,
  ess:[`Slide: cada "página" da apresentação.`,`Transição: efeito ao passar de um slide para outro.`,`Animação: efeito em um item dentro do slide.`,`F5: começa a apresentação do início.`],
  mais:`Transição e animação se confundem. A transição acontece entre slides (o slide inteiro entra girando, por exemplo); a animação acontece num elemento dentro do slide (um título que aparece letra por letra).\n\nAs anotações ficam embaixo do slide e só o apresentador vê: servem de "cola" para quem fala.\n\nDica de apresentação: pouco texto por slide, letras grandes e imagens que ajudam a explicar.`,
  ex:`Slide 1: título. Slide 2: três tópicos curtos. Ao passar para o slide 3, uma transição de esmaecer.`,
  qs:[{q:`O efeito que acontece ao passar de um slide para o próximo é a`,al:[`transição.`,`animação.`,`anotação.`,`régua.`],dica:`"Trans" é passar de um lugar para outro.`,p:`Transição é o efeito entre slides.`},
   {q:`Fazer um título aparecer letra por letra dentro do slide é uma`,al:[`animação.`,`transição.`,`margem.`,`tabela.`],dica:`É um efeito num item dentro do slide.`,p:`Animação é o efeito aplicado a um elemento do slide.`},
   {q:`Para começar a apresentação pelo primeiro slide, aperta-se`,al:[`F5`,`F1`,`Esc`,`Ctrl + Z`],dica:`É uma tecla de função.`,p:`F5 inicia a apresentação do começo. Esc encerra.`}]},
 {id:'inf7',t:'Internet e e-mail',frase:`Na internet, cada página tem um endereço (URL). No e-mail, você escolhe quem recebe e pode mandar anexos.`,
  ess:[`URL: endereço de um site, como www.vunesp.com.br.`,`Link: texto ou imagem que leva a outra página.`,`Para: destinatário principal. Cc: cópia visível. Cco: cópia oculta.`,`Anexo: arquivo enviado junto com o e-mail (símbolo do clipe).`],
  mais:`O navegador é o programa que abre sites: Chrome, Edge, Firefox. Na barra de endereço você digita a URL; na busca (como o Google) você digita palavras.\n\nNo e-mail: quem está no Cc recebe e todos veem; quem está no Cco recebe, mas ninguém vê o endereço dele. Use Cco ao mandar para muita gente que não se conhece, para proteger os e-mails delas.\n\nCuidado com e-mails estranhos pedindo senha ou com links suspeitos: pode ser golpe (phishing). Bancos e órgãos públicos não pedem senha por e-mail.`,
  ex:`Para mandar o edital a 30 candidatos sem mostrar os e-mails de todos, coloque os endereços no Cco.`,
  qs:[{q:`Para enviar um e-mail sem que os outros destinatários vejam um endereço, usa-se o campo`,al:[`Cco`,`Cc`,`Para`,`Assunto`],dica:`Cópia oculta.`,p:`Cco = com cópia oculta.`},
   {q:`O endereço de um site, como www.vunesp.com.br, chama-se`,al:[`URL.`,`anexo.`,`pasta.`,`planilha.`],dica:`São três letras.`,p:`URL é o endereço de uma página na internet.`},
   {q:`Um e-mail pede a senha do seu banco por um link. O mais seguro é`,al:[`não clicar e apagar a mensagem.`,`clicar e digitar a senha rapidinho.`,`responder com a senha.`,`encaminhar para todos os amigos.`],dica:`Banco não pede senha por e-mail.`,p:`É golpe (phishing). Não clique nem informe dados.`}]},
 {id:'inf8',t:'Google Workspace e Microsoft Teams',frase:`São ferramentas on-line para trabalhar em equipe: guardar arquivos, editar juntos, conversar e fazer reuniões.`,
  ess:[`Drive: guarda arquivos na nuvem (internet).`,`Documentos, Planilhas e Apresentações: versões on-line do Word, Excel e PowerPoint.`,`Meet e Teams: reuniões por vídeo. Agenda: compromissos.`,`Formulários: cria questionários e pesquisas.`],
  mais:`Na nuvem, o arquivo fica guardado na internet e pode ser aberto em qualquer computador ou celular, com login. Várias pessoas podem editar o mesmo documento ao mesmo tempo, e tudo é salvo sozinho.\n\nPara dividir um arquivo do Drive, usa-se o botão Compartilhar e escolhe-se quem pode ver ou editar.\n\nO Microsoft Teams junta chat, chamadas de áudio e vídeo e equipes (grupos de trabalho), e permite editar arquivos do Word, Excel e PowerPoint junto com os colegas.`,
  ex:`O setor usa uma planilha no Google Planilhas: cada um preenche sua parte, ao mesmo tempo, sem mandar arquivo por e-mail.`,
  qs:[{q:`O serviço do Google usado para guardar arquivos na nuvem é o`,al:[`Drive.`,`Meet.`,`Agenda.`,`Formulários.`],dica:`É como um pen drive na internet.`,p:`O Google Drive guarda arquivos na nuvem.`},
   {q:`Para fazer uma reunião por vídeo, pode-se usar`,al:[`Google Meet ou Microsoft Teams.`,`Google Planilhas.`,`Bloco de Notas.`,`Lixeira.`],dica:`Ferramentas de chamada de vídeo.`,p:`Meet e Teams fazem reuniões por vídeo.`},
   {q:`Para criar uma pesquisa de satisfação com os cidadãos, usa-se o`,al:[`Google Formulários.`,`Google Drive.`,`Paint.`,`Explorador de Arquivos.`],dica:`Questionário = formulário.`,p:`O Formulários cria questionários e organiza as respostas.`}]}
]},
ing:{nome:'Inglês do básico ao intermediário',aulas:[
 {id:'ing1',t:'Cumprimentos e apresentações',nivel:'Básico',frase:`Para começar uma conversa: cumprimente, diga seu nome e pergunte o nome da pessoa.`,
  ess:[`Hello / Hi = Olá. Good morning = Bom dia. Good afternoon = Boa tarde. Good evening = Boa noite (ao chegar).`,`My name is Ana. = Meu nome é Ana.`,`What is your name? = Qual é o seu nome?`,`Nice to meet you. = Prazer em conhecer você.`],
  mais:`"Good night" é boa noite na despedida, na hora de dormir. Ao chegar, à noite, diz-se "Good evening".\n\n"How are you?" (Como vai?) costuma ser respondido com "I'm fine, thank you. And you?" (Estou bem, obrigado. E você?).\n\nPara se despedir: "Goodbye" ou "Bye" (tchau) e "See you later" (até mais).`,
  ex:`— Hi! My name is Carlos. What is your name?\n— Hello, Carlos! I'm Beatriz. Nice to meet you!\n(— Oi! Meu nome é Carlos. Qual é o seu nome? — Olá, Carlos! Sou a Beatriz. Prazer!)`,
  qs:[{q:`Ao chegar a uma reunião às 20h, você diz:`,al:[`Good evening.`,`Good night.`,`Good morning.`,`Goodbye.`],dica:`"Good night" é para despedida e hora de dormir.`,p:`"Good evening" é boa noite ao chegar. "Good night", ao se despedir.`},
   {q:`"Nice to meet you" significa`,al:[`Prazer em conhecer você.`,`Vejo você depois.`,`Qual é o seu nome?`,`Bom dia.`],dica:`"Meet" é conhecer, encontrar.`,p:`É o "prazer em conhecer".`},
   {q:`Como perguntar o nome de alguém?`,al:[`What is your name?`,`Where is your name?`,`How old is your name?`,`Who are name?`],dica:`"What" = o que, qual.`,p:`"What is your name?" = Qual é o seu nome?`}]},
 {id:'ing2',t:'Verbo to be: ser e estar',nivel:'Básico',frase:`O verbo "to be" significa ser ou estar e muda conforme a pessoa: am, is, are.`,
  ess:[`I am = eu sou / estou.`,`He is / She is / It is = ele, ela, isso é / está.`,`You are / We are / They are = você, nós, eles são / estão.`,`Negativa: I am not; she is not (isn't); they are not (aren't).`],
  mais:`Formas curtas (contrações) são muito usadas: I'm, you're, he's, she's, it's, we're, they're.\n\nPara perguntar, troque a ordem: "You are tired." vira "Are you tired?" (Você está cansado?). "She is a teacher." vira "Is she a teacher?".\n\nResposta curta: "Yes, I am." / "No, I'm not."`,
  ex:`I am a student. She is at work. They are not here. Are you ready?\n(Eu sou estudante. Ela está no trabalho. Eles não estão aqui. Você está pronto?)`,
  qs:[{q:`Complete: She ___ a secretary.`,al:[`is`,`am`,`are`,`be`],dica:`"She" é ela: uma pessoa só.`,p:`He, she e it usam "is".`},
   {q:`Complete: They ___ at the office.`,al:[`are`,`is`,`am`,`be`],dica:`"They" é eles: plural.`,p:`You, we e they usam "are".`},
   {q:`Qual é a pergunta de "You are ready."?`,al:[`Are you ready?`,`You are ready?`,`Is you ready?`,`Ready you are?`],dica:`Na pergunta, o verbo vem antes da pessoa.`,p:`Inverte-se: "Are you ready?"`}]},
 {id:'ing3',t:'Artigos e plural',nivel:'Básico',frase:`"A" e "an" = um, uma (qualquer). "The" = o, a, os, as (um específico). O plural geralmente ganha -s.`,
  ess:[`"A" antes de som de consoante: a book, a car.`,`"An" antes de som de vogal: an apple, an hour.`,`"The" = o, a, os, as: the office (o escritório).`,`Plural: book → books; box → boxes; city → cities.`],
  mais:`O que vale é o som, não a letra: "an hour" (o h não é pronunciado) e "a university" (começa com som de "iu").\n\nPalavras terminadas em s, x, ch, sh ganham -es: boxes, watches. Terminadas em consoante + y trocam o y por -ies: city → cities.\n\nAlguns plurais são irregulares: man → men, woman → women, child → children, person → people.`,
  ex:`I have a pen and an orange. The pen is blue. There are two children and three women.\n(Tenho uma caneta e uma laranja. A caneta é azul. Há duas crianças e três mulheres.)`,
  qs:[{q:`Complete: I need ___ umbrella.`,al:[`an`,`a`,`two`,`these`],dica:`"Umbrella" começa com som de vogal.`,p:`Antes de som de vogal usa-se "an".`},
   {q:`O plural de "child" é`,al:[`children`,`childs`,`childes`,`childen`],dica:`É um plural irregular.`,p:`Child → children (criança → crianças).`},
   {q:`O plural de "box" é`,al:[`boxes`,`boxs`,`boxies`,`box`],dica:`Palavras terminadas em x ganham -es.`,p:`Box → boxes.`}]},
 {id:'ing4',t:'Pronomes e possessivos',nivel:'Básico',frase:`Pronomes substituem nomes (I, you, he…). Possessivos dizem de quem é (my, your, his…).`,
  ess:[`I → my (eu → meu). You → your (você → seu).`,`He → his (ele → dele). She → her (ela → dela).`,`We → our (nós → nosso). They → their (eles → deles).`,`It → its (para coisas e animais).`],
  mais:`Em português, "seu carro" pode ser de você ou dele. Em inglês não há dúvida: "your car" (de você), "his car" (dele), "her car" (dela).\n\nO possessivo vem antes da coisa e não muda no plural: my book, my books.\n\nTambém existe o 's para dizer de quem é: "Ana's phone" = o telefone da Ana.`,
  ex:`This is Maria. Her office is on the second floor. Her colleagues are nice, and their manager is Paulo.\n(Esta é a Maria. O escritório dela fica no segundo andar. Os colegas dela são legais, e o gerente deles é o Paulo.)`,
  qs:[{q:`Complete: This is John. ___ car is red.`,al:[`His`,`Her`,`Its`,`Their`],dica:`John é homem: dele.`,p:`His = dele.`},
   {q:`Complete: Maria and Pedro love ___ jobs.`,al:[`their`,`his`,`her`,`our`],dica:`Maria e Pedro = eles.`,p:`Their = deles.`},
   {q:`"Ana's phone" significa`,al:[`o telefone da Ana.`,`a Ana é um telefone.`,`os telefones da Ana.`,`a Ana telefona.`],dica:`O 's indica de quem é.`,p:`'s indica posse: o telefone da Ana.`}]},
 {id:'ing5',t:'Presente simples: a rotina',nivel:'Básico',frase:`O presente simples fala de hábitos e rotina. Com he, she e it, o verbo ganha -s.`,
  ess:[`I work every day. (Eu trabalho todo dia.)`,`She works at the city hall. (Ela trabalha na prefeitura.)`,`Negativa: I don't work / She doesn't work.`,`Pergunta: Do you work? / Does she work?`],
  mais:`O -s só aparece com he, she e it: I work, you work, we work, they work, mas he works, she works.\n\nNa negativa e na pergunta, quem recebe a marca é o auxiliar "does", e o verbo volta ao normal: "She doesn't work" (e não "doesn't works"); "Does she work?".\n\nPalavras de frequência: always (sempre), usually (geralmente), sometimes (às vezes), never (nunca). Ficam antes do verbo: "I always arrive early."`,
  ex:`I usually start work at 8. My boss always arrives at 9. Does he drink coffee? No, he doesn't.\n(Geralmente começo a trabalhar às 8. Meu chefe sempre chega às 9. Ele toma café? Não.)`,
  qs:[{q:`Complete: She ___ at the city hall.`,al:[`works`,`work`,`working`,`is work`],dica:`"She" pede o verbo com -s.`,p:`Com he, she e it o verbo ganha -s.`},
   {q:`Qual frase está correta?`,al:[`He doesn't work on Sundays.`,`He don't work on Sundays.`,`He doesn't works on Sundays.`,`He not work on Sundays.`],dica:`Com "he" usa-se "does", e o verbo fica sem -s.`,p:`Doesn't + verbo normal: doesn't work.`},
   {q:`"Never" significa`,al:[`nunca.`,`sempre.`,`às vezes.`,`geralmente.`],dica:`É o oposto de "always".`,p:`Never = nunca.`}]},
 {id:'ing6',t:'There is / there are e lugares',nivel:'Básico',frase:`"There is" = há, existe (um). "There are" = há, existem (vários). "In", "on", "at" e "next to" dizem onde.`,
  ess:[`There is a printer in the office. (Há uma impressora no escritório.)`,`There are two meetings today. (Há duas reuniões hoje.)`,`In = dentro. On = em cima. Next to = ao lado. Under = embaixo.`,`At = em (lugar específico): at work, at home.`],
  mais:`Use "there is" com singular e "there are" com plural. Pergunta: "Is there a bank near here?" (Tem um banco aqui perto?).\n\nAs preposições também servem para tempo: in (meses e anos: in May, in 2027), on (dias: on Monday), at (horas: at 8 o'clock).`,
  ex:`There is a phone on the desk. The files are in the cabinet, next to the window.\n(Há um telefone em cima da mesa. Os arquivos estão no armário, ao lado da janela.)`,
  qs:[{q:`Complete: There ___ three computers in the room.`,al:[`are`,`is`,`am`,`be`],dica:`Três computadores: plural.`,p:`Plural pede "there are".`},
   {q:`"The phone is on the desk" significa que o telefone está`,al:[`em cima da mesa.`,`embaixo da mesa.`,`dentro da gaveta.`,`longe da mesa.`],dica:`"On" é sobre, em cima.`,p:`On = em cima de.`},
   {q:`Complete: The meeting is ___ Monday.`,al:[`on`,`in`,`at`,`under`],dica:`Dias da semana usam…`,p:`Com dias da semana usa-se "on".`}]},
 {id:'ing7',t:'Presente contínuo: o que acontece agora',nivel:'Intermediário',frase:`Para falar do que está acontecendo agora: am, is ou are + verbo com -ing.`,
  ess:[`I am working now. (Estou trabalhando agora.)`,`She is talking on the phone. (Ela está falando ao telefone.)`,`They are waiting. (Eles estão esperando.)`,`Pergunta: Are you listening? Negativa: He isn't sleeping.`],
  mais:`É o "estar + -ndo" do português: estou trabalhando = I am working.\n\nRegras do -ing: verbo terminado em e perde o e (write → writing); alguns dobram a última letra (sit → sitting, run → running).\n\nCompare: "I work at the city hall" (rotina, sempre) × "I am working at home today" (só hoje, agora).`,
  ex:`Sorry, the manager is in a meeting now. He is talking to the mayor.\n(Desculpe, o gerente está em reunião agora. Ele está falando com o prefeito.)`,
  qs:[{q:`Complete: Look! It ___ raining.`,al:[`is`,`are`,`am`,`be`],dica:`"It" é singular.`,p:`It + is + verbo com -ing.`},
   {q:`O "-ing" de "write" é`,al:[`writing`,`writeing`,`writting`,`wrote`],dica:`Verbo terminado em e perde o e.`,p:`Write → writing.`},

 {id:'ing8',t:'Passado simples',nivel:'Intermediário',frase:`Para falar do passado: verbos regulares ganham -ed; os irregulares têm forma própria.`,

const pad = n => String(n).padStart(2, '0');
function key(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k){ const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return key(d); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
const today = () => key(new Date());
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rich(s){ return esc(s).replace(/\n/g, '<br>'); }
function texto(s, rev){ return esc(s).replace(/\n/g, '<br>').replace(/⟦(.+?)⟧/g, rev ? '<mark>$1</mark>' : '$1'); }
const paras = s => s.split('\n\n').map(p => `<p>${rich(p)}</p>`).join('');

const KEY = 'guara-v1';
// log: [data, id, resultado (1 de primeira, 2 com dica, 0 errou), alternativa marcada, origem]
const fresh = () => ({v:1, start:today(), days:{}, aulas:{}, qs:{}, log:[], sims:[], ses:[], modo:'simples', big:false, autoEnd:true, nome:''});
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return Object.assign(fresh(), s); } catch (e) {} return fresh(); }
let S = load();

function dia(k){ return S.days[k] || (S.days[k] = {q:0, ok:0, aulas:0, conc:0}); }
function studied(k){ const d = S.days[k]; return !!(d && (d.q >= 3 || d.aulas >= 1)); }
function streak(){ let k = today(); if (!studied(k)) k = addDays(k, -1); let n = 0; while (studied(k)){ n++; k = addDays(k, -1); } return n; }
function registrar(id, res, ch, kind){
  const t = today(), r = S.qs[id] || {n:0, ok:0};
  r.n++; if (res === 1) r.ok++; r.last = t; r.lastRes = res;
  r.due = res === 0 ? addDays(t, 1) : null;
  S.qs[id] = r;
  const d = dia(t); d.q++; if (res === 1) d.ok++; if (kind === 'conc' || kind === 'sim') d.conc++;
  S.log.push([t, id, res, ch, kind]);
  if (S.log.length > 2500) S.log = S.log.slice(-2500);
  save();
}

function novoQuiz(ids, tipo, extra){

function qObj(id){ return CM[id] || QA[id]; }
function prepQ(){
  const q = qObj(quiz.ids[quiz.i]);
  quiz.perm = q.o ? q.al.map((_, i) => i) : shuffle(q.al.map((_, i) => i));
  quiz.sel = null; quiz.tries = 0; quiz.wrong = []; quiz.done = false; quiz.result = null; quiz.showMais = S.modo === 'completo';
}
function responder(){
  const q = qObj(quiz.ids[quiz.i]);
  if (quiz.sel == null || quiz.done) return;
  if (quiz.sel === q.c){ quiz.done = true; quiz.result = quiz.tries === 0 ? 1 : 2; }
  else {
    quiz.wrong.push(quiz.sel); quiz.tries++; quiz.sel = null;
    if (quiz.tries >= 2){ quiz.done = true; quiz.result = 0; }
  }
  if (quiz.done){
    quiz.res.push({id:q.id, r:quiz.result});
    registrar(q.id, quiz.result, quiz.wrong.length ? quiz.wrong[0] : q.c, quiz.tipo === 'aula' ? 'aula' : 'conc');
  }
  render();
}
function proxima(){
  quiz.i++;
  if (quiz.i >= quiz.ids.length) fimQuiz(); else { prepQ(); render(); scrollTo(0, 0); }
}
function fimQuiz(){
  const t = today(), first = quiz.res.filter(r => r.r === 1).length, hint = quiz.res.filter(r => r.r === 2).length, wrong = quiz.res.filter(r => r.r === 0).length;
  quiz.fim = {first, hint, wrong};
  if (quiz.tipo === 'aula'){
    const ant = S.aulas[quiz.aula] || {};
    S.aulas[quiz.aula] = {done:ant.done || t, last:t, first, hint, wrong, vezes:(ant.vezes || 0) + 1};
    dia(t).aulas++;
  }
  S.ses.push({d:t, k:quiz.tipo === 'aula' ? 'aula' : 'treino', ref:quiz.aula || quiz.mat || 'misto', n:quiz.res.length, first, hint, wrong, min:Math.max(1, Math.round((Date.now() - quiz.t0) / 60000))});
  if (S.ses.length > 300) S.ses = S.ses.slice(-300);
  save(); render(); scrollTo(0, 0);
}

// treino do concurso: por matéria (5) ou misturado (10), priorizando erros e questões novas
function pickConc(mat, n){
  const t = today(), pool = CONC.filter(q => !mat || q.a === mat);
  const devidas = shuffle(pool.filter(q => S.qs[q.id] && S.qs[q.id].due && S.qs[q.id].due <= t));
  const novas = shuffle(pool.filter(q => !S.qs[q.id]));
  const vistas = shuffle(pool.filter(q => S.qs[q.id] && !(S.qs[q.id].due && S.qs[q.id].due <= t)));
  const out = []; [devidas, novas, vistas].forEach(l => l.forEach(q => { if (out.length < n && !out.includes(q.id)) out.push(q.id); }));
  return out;
}
function pickMisto(porMat){
  let ids = []; MATS.forEach(m => { ids = ids.concat(pickConc(m, porMat[m])); }); return ids;
}

// simulado do concurso: sem correção até o fim
function startSim(dist){
  const ids = pickMisto(dist), perm = {};
  ids.forEach(id => { const q = CM[id]; perm[id] = q.o ? q.al.map((_, i) => i) : shuffle(q.al.map((_, i) => i)); });
  sim = {ids, perm, i:0, ans:{}, t0:Date.now(), dur:ids.length * SEG_Q, auto:S.autoEnd !== false, end:false};
  render(); scrollTo(0, 0);
}
function finishSim(timeout){
  const t = today(); let c = 0, w = 0, b = 0;
  sim.ids.forEach(id => {
    const q = CM[id], a = sim.ans[id];
    if (a == null){ b++; registrar(id, 0, null, 'sim'); return; }
    if (a === q.c){ c++; registrar(id, 1, a, 'sim'); } else { w++; registrar(id, 0, a, 'sim'); }
  });
  sim.end = true;
  sim.result = {c, w, b, n:sim.ids.length, min:Math.max(1, Math.round((Date.now() - sim.t0) / 60000)), timeout:!!timeout};
  S.sims.unshift({date:t, ...sim.result, items:sim.ids.map(id => [id, sim.ans[id] == null ? null : sim.ans[id]])});
  S.sims = S.sims.slice(0, 40);
  S.ses.push({d:t, k:'sim', n:sim.result.n, first:c, hint:0, wrong:w + b, min:sim.result.min});
  save();
}

const semanaDe = k => addDays(k, -((parseKey(k).getDay() + 6) % 7));
function relDados(){
  const t = today(), sem = {};
  Object.keys(S.days).forEach(k => { const w = semanaDe(k), s = sem[w] || (sem[w] = {dias:0, q:0, ok:0, aulas:0}); const d = S.days[k]; if (studied(k)) s.dias++; s.q += d.q || 0; s.ok += d.ok || 0; s.aulas += d.aulas || 0; });
  const conc = MATS.map(m => { let n = 0, ok = 0; CONC.filter(q => q.a === m).forEach(q => { const r = S.qs[q.id]; if (r){ n += r.n; ok += r.ok; } }); return {m, n, ok}; });
  const erros = S.log.filter(l => l[2] !== 1).slice(-60).reverse().map(([d, id, r, ch, kind]) => { const q = qObj(id); return q ? {d, q, r, ch, kind} : null; }).filter(Boolean);

  let tq = 0, tok = 0; for (const d of Object.values(S.days)){ tq += d.q || 0; tok += d.ok || 0; }
  const comDica = S.log.filter(l => l[2] === 2).length;
  return {t, semanas:Object.keys(sem).sort().map(w => ({w, ...sem[w]})), conc, erros, ult7, tq, tok, comDica, left:diffDays(t, EXAM_KEY)};

function relLeitura(D){

  CURSO_KEYS.forEach(k => { const c = CURSOS[k], f = c.aulas.filter(a => S.aulas[a.id]).length, rv = c.aulas.filter(a => statusAula(a) === 'revisar').map(a => a.t);

  const cm = D.conc.filter(x => x.n >= 3).sort((a, b) => a.ok / a.n - b.ok / b.n);
