<style>
/* Layout: uma coluna de celular (máx. 560px), letra um pouco maior e uma ideia por tela. Azul-petróleo de caderno, amarelo de marca-texto para o que importa. */
:root{
  --paper:#f2f6f7; --card:#ffffff; --ink:#132026; --muted:#53646b; --line:#d4dfe2;
  --pen:#155e75; --pen-soft:#e0eff3; --on-pen:#ffffff;
  --mark:#ffd84d; --mark-ink:#132026;
  --ok:#1b7c4b; --ok-soft:#e1f3e8; --bad:#bf3a2e; --bad-soft:#fbe8e6;
  --shadow:rgba(21,94,117,.22);
  --f-ui:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --base:17px;
}
@media (prefers-color-scheme: dark){

    --paper:#0c1316; --card:#141e22; --ink:#e5eef0; --muted:#97a9ae; --line:#27363b;
    --pen:#67c6dd; --pen-soft:#14363f; --on-pen:#0c1316;
    --mark:#5e4e0a; --mark-ink:#fff3c4;
    --ok:#56cc8e; --ok-soft:#12301f; --bad:#ff8174; --bad-soft:#3b1a17;
    --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1316; --card:#141e22; --ink:#e5eef0; --muted:#97a9ae; --line:#27363b;
  --pen:#67c6dd; --pen-soft:#14363f; --on-pen:#0c1316;

}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

</style>

<script>
document.documentElement.lang = 'pt-BR';

const EXAM_KEY = '2027-02-21';
const VUNESP = 'https://www.vunesp.com.br';
const L = 'ABCDE';
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MATS = ['Português','Matemática','Informática','Específicos'];
const NA_PROVA = {'Português':10,'Matemática':10,'Informática':5,'Específicos':25};
const SEG_Q = 216; // 3 horas para 50 questões: cerca de 3min36 por questão

/* ---------- questões do concurso (estilo VUNESP, 5 alternativas). ⟦…⟧ marca a pista no texto. ---------- */
const CONC = [
{id:'lp1',a:'Português',x:`A prefeitura abriu um posto de atendimento no bairro. ⟦Antes, os moradores precisavam ir até o centro⟧ para pedir documentos. Agora, ⟦resolvem quase tudo perto de casa⟧, sem gastar com ônibus.`,
 q:`De acordo com o texto, a principal vantagem do novo posto é`,
 al:[`facilitar o acesso dos moradores aos serviços.`,`aumentar o preço das passagens de ônibus.`,`fechar o atendimento no centro da cidade.`,`obrigar os moradores a ir ao centro.`,`diminuir o número de documentos emitidos.`],c:0,
 dica:`Compare o "antes" e o "agora" do texto.`,
 p:`Antes era preciso ir ao centro; agora dá para resolver perto de casa. A vantagem é o acesso mais fácil.`,
 mais:`Em interpretação, a resposta certa diz o que o texto diz, com outras palavras. As erradas costumam inventar algo (o preço da passagem) ou dizer o contrário do texto (ter que ir ao centro).`},
{id:'lp2',a:'Português',x:`O servidor foi ⟦ágil⟧ no atendimento e resolveu o problema ⟦em poucos minutos⟧.`,
 q:`Sem mudar o sentido da frase, "ágil" pode ser trocado por`,
 al:[`rápido.`,`lento.`,`grosseiro.`,`distraído.`,`confuso.`],c:0,
 dica:`Releia o fim da frase: ele resolveu "em poucos minutos".`,
 p:`"Ágil" quer dizer rápido, ligeiro. O próprio texto ajuda: ele resolveu tudo em poucos minutos.`,
 mais:`Quando não souber o significado de uma palavra, use o contexto: as palavras em volta dão pistas. "Lento" é o contrário (antônimo) de ágil.`},
{id:'lp3',a:'Português',x:``,
 q:`Assinale a frase com a pontuação correta.`,
 al:[`Maria, traga os documentos, por favor.`,`Maria traga, os documentos por favor.`,`Maria traga os documentos, por, favor.`,`Maria, traga os, documentos por favor.`,`Maria traga os documentos por, favor.`],c:0,
 dica:`Quando chamamos alguém pelo nome, esse nome fica separado por vírgula.`,
 p:`"Maria" é o vocativo (a pessoa chamada) e fica separado por vírgula. "Por favor", no fim, também.`,
 mais:`Vírgulas que mais caem: separar o vocativo ("Maria, venha"), separar itens de uma lista ("canetas, papéis e clipes") e isolar explicações ("isto é", "por exemplo"). Nunca separe o sujeito do verbo: "Os documentos, chegaram" está errado.`},
{id:'lp4',a:'Português',x:``,
 q:`Assinale a frase em que o acento indicativo de crase (à) está correto.`,
 al:[`Entreguei o ofício à diretora.`,`Fui à pé até a prefeitura.`,`Começou à chover cedo.`,`Ele se referiu à você.`,`Vou à Brasília amanhã.`],c:0,
 dica:`Troque a palavra feminina por uma masculina. Se aparecer "ao", existe crase.`,
 p:`Entregar algo "a" alguém + "a diretora" = à diretora. Teste: "Entreguei o ofício ao diretor". Apareceu "ao", então há crase.`,
 mais:`Não há crase antes de palavra masculina (a pé), antes de verbo (a chover), antes de "você" e antes de cidades que não usam artigo. Truque da volta: "Vou a Brasília, volto de Brasília" (sem crase); "Vou à Bahia, volto da Bahia" (com crase).`},
{id:'lp5',a:'Português',x:``,
 q:`Assinale a frase em que a concordância verbal está correta.`,
 al:[`Faltam dois documentos no processo.`,`Falta dois documentos no processo.`,`Haviam muitos candidatos na fila.`,`Fazem três anos que trabalho aqui.`,`Os funcionário chegou cedo.`],c:0,
 dica:`Descubra o sujeito: o que é que "falta"?`,
 p:`O sujeito é "dois documentos" (plural), então o verbo vai para o plural: faltam.`,
 mais:`Pegadinhas clássicas: "haver" no sentido de existir fica no singular ("Havia muitos candidatos"); "fazer" indicando tempo também ("Faz três anos"). Quando o sujeito vem depois do verbo, inverta para conferir: "Dois documentos faltam".`},
{id:'lp6',a:'Português',x:``,
 q:`Assinale a frase escrita de acordo com a norma-padrão.`,
 al:[`Prefiro trabalhar de manhã a trabalhar à noite.`,`Prefiro mais trabalhar de manhã do que à noite.`,`Prefiro trabalhar de manhã do que à noite.`,`Prefiro mais trabalhar de manhã que de noite.`,`Eu prefiro mais de manhã do que de noite.`],c:0,
 dica:`Na norma-padrão, quem prefere, prefere uma coisa "a" outra.`,
 p:`O verbo "preferir" pede a preposição "a": prefere-se uma coisa a outra. Não se usa "mais" nem "do que".`,
 mais:`Outras regências que caem muito: "assistir ao jogo" (no sentido de ver), "obedecer ao regulamento", "chegar a algum lugar" (e não "chegar em"), "ir ao banco".`},
{id:'lp7',a:'Português',x:`O sistema estava fora do ar; ⟦por isso⟧, o atendimento foi feito em papel.`,
 q:`A expressão "por isso" indica`,
 al:[`consequência.`,`oposição.`,`tempo.`,`comparação.`,`condição.`],c:0,
 dica:`O que aconteceu por causa do sistema fora do ar?`,
 p:`O atendimento em papel foi a consequência de o sistema estar fora do ar.`,
 mais:`Consequência ou conclusão: por isso, portanto, logo, então. Oposição: mas, porém, contudo. Causa: porque, pois, já que. Condição: se, caso.`},

{id:'mt1',a:'Matemática',o:1,x:``,
 q:`Uma repartição tinha 40 processos para analisar e já analisou 25% deles. Quantos processos já foram analisados?`,
 al:[`10`,`15`,`20`,`25`,`30`],c:0,
 dica:`25% é o mesmo que um quarto (1/4).`,
 p:`25% de 40 = 40 ÷ 4 = 10 processos.`,
 mais:`Atalhos de porcentagem: 50% é a metade; 25% é um quarto (divide por 4); 10% divide por 10; 1% divide por 100. Para 30%, faça 10% e multiplique por 3.`},
{id:'mt2',a:'Matemática',o:1,x:``,
 q:`Uma impressora imprime 30 páginas em 2 minutos. No mesmo ritmo, quantas páginas ela imprime em 5 minutos?`,
 al:[`60`,`65`,`70`,`75`,`80`],c:3,
 dica:`Descubra primeiro quantas páginas ela imprime em 1 minuto.`,
 p:`Em 1 minuto: 30 ÷ 2 = 15 páginas. Em 5 minutos: 15 × 5 = 75 páginas.`,
 mais:`Na regra de três, achar o valor de "1 unidade" (1 minuto, 1 litro, 1 pessoa) deixa a conta mais fácil. Depois é só multiplicar.`},
{id:'mt3',a:'Matemática',o:1,x:``,
 q:`De uma caixa com 24 canetas, 3/8 foram entregues aos funcionários. Quantas canetas foram entregues?`,
 al:[`3`,`6`,`8`,`9`,`12`],c:3,
 dica:`Divida 24 em 8 partes iguais e pegue 3 dessas partes.`,
 p:`24 ÷ 8 = 3 canetas em cada parte. Três partes: 3 × 3 = 9 canetas.`,
 mais:`Fração de uma quantidade: divida pelo número de baixo (denominador) e multiplique pelo de cima (numerador).`},
{id:'mt4',a:'Matemática',o:1,x:``,
 q:`Um ônibus passa no ponto a cada 12 minutos e outro a cada 18 minutos. Se os dois passaram juntos às 8h, quando passarão juntos de novo?`,
 al:[`8h30`,`8h36`,`8h45`,`9h00`,`9h12`],c:1,
 dica:`Procure o primeiro número que aparece nas duas tabuadas: a do 12 e a do 18.`,
 p:`Múltiplos de 12: 12, 24, 36… Múltiplos de 18: 18, 36… O primeiro em comum é 36 (o MMC). 8h + 36 min = 8h36.`,
 mais:`"Voltam a coincidir" e "passam juntos de novo" pedem o MMC (mínimo múltiplo comum). "Dividir em partes iguais, do maior tamanho possível" pede o MDC (máximo divisor comum).`},
{id:'mt5',a:'Matemática',o:1,x:``,
 q:`Pedro e Ana, juntos, têm 50 anos. Ana tem 10 anos a mais que Pedro. Qual é a idade de Pedro?`,
 al:[`15`,`20`,`25`,`30`,`35`],c:1,
 dica:`Se Pedro tem x anos, Ana tem x + 10. Some os dois e iguale a 50.`,
 p:`x + (x + 10) = 50 → 2x + 10 = 50 → 2x = 40 → x = 20. Pedro tem 20 e Ana tem 30.`,
 mais:`Confira a resposta no enunciado: 20 + 30 = 50 e 30 − 20 = 10. Testar a resposta evita erro bobo.`},
{id:'mt6',a:'Matemática',o:1,x:``,
 q:`Uma sala retangular mede 5 m por 4 m. Quantos metros quadrados de piso são necessários para cobrir todo o chão?`,
 al:[`9 m²`,`18 m²`,`20 m²`,`25 m²`,`40 m²`],c:2,
 dica:`Piso cobre o chão todo: é área (comprimento × largura).`,
 p:`Área do retângulo = 5 × 4 = 20 m².`,
 mais:`18 seria o perímetro (5 + 4 + 5 + 4), que é o contorno da sala, usado para rodapé. Piso, tinta e grama pedem área.`},
{id:'mt7',a:'Matemática',o:1,x:``,
 q:`Um setor atendeu 30, 40 e 50 pessoas em três dias. Qual foi a média de atendimentos por dia?`,
 al:[`30`,`35`,`40`,`45`,`120`],c:2,
 dica:`Some os três dias e divida por 3.`,
 p:`(30 + 40 + 50) ÷ 3 = 120 ÷ 3 = 40 atendimentos por dia.`,
 mais:`Média aritmética: soma tudo e divide pela quantidade. 120 é a soma, não a média.`},

{id:'in1',a:'Informática',x:``,
 q:`No Windows 11, o atalho Ctrl + C serve para`,
 al:[`copiar o item selecionado.`,`colar o item copiado.`,`recortar o item selecionado.`,`desfazer a última ação.`,`fechar a janela.`],c:0,
 dica:`Pense em "C" de Copiar.`,
 p:`Ctrl + C copia. Ctrl + V cola, Ctrl + X recorta e Ctrl + Z desfaz.`,
 mais:`O que é copiado ou recortado vai para a área de transferência, um espaço temporário. De lá, você cola com Ctrl + V quantas vezes quiser.`},
{id:'in2',a:'Informática',x:``,
 q:`No MS-Word 2016 em português, o atalho para aplicar negrito ao texto selecionado é`,
 al:[`Ctrl + N`,`Ctrl + B`,`Ctrl + I`,`Ctrl + S`,`Ctrl + P`],c:0,
 dica:`No Word em português, os atalhos de formatação seguem as iniciais em português.`,
 p:`No Word em português: Ctrl + N = Negrito, Ctrl + I = Itálico, Ctrl + S = Sublinhado.`,
 mais:`Pegadinha comum: no Word em português, Ctrl + B é Salvar (e não negrito, como no inglês "bold"). Ctrl + P é Imprimir.`},
{id:'in3',a:'Informática',x:``,
 q:`No MS-Excel 2016, a fórmula que soma os valores das células de A1 até A5 é`,
 al:[`=SOMA(A1:A5)`,`=SOMA(A1;A5)`,`SOMA A1 até A5`,`=A1+A5`,`=MÉDIA(A1:A5)`],c:0,
 dica:`Os dois-pontos (:) significam "até".`,
 p:`=SOMA(A1:A5) soma A1, A2, A3, A4 e A5. Toda fórmula começa com o sinal de igual.`,
 mais:`=SOMA(A1;A5) soma só A1 e A5 (o ponto e vírgula significa "e"). =A1+A5 também soma só as duas. =MÉDIA calcula a média.`},
{id:'in4',a:'Informática',x:``,
 q:`Ao enviar um e-mail, para que um destinatário receba a mensagem sem que os outros vejam o endereço dele, deve-se usar o campo`,
 al:[`Cco`,`Cc`,`Para`,`Assunto`,`Anexo`],c:0,
 dica:`Procure o campo de cópia "oculta".`,
 p:`Cco = com cópia oculta. Quem está no Cco recebe, mas os outros não veem o endereço.`,
 mais:`Para: destinatário principal. Cc: cópia visível para todos. Cco: cópia escondida, útil para mandar a muita gente sem expor os e-mails de todos.`},

{id:'ce1',a:'Específicos',x:``,
 q:`Os princípios da Administração Pública escritos no art. 37 da Constituição Federal são`,
 al:[`legalidade, impessoalidade, moralidade, publicidade e eficiência.`,`lucro, rapidez, simpatia, sigilo e economia.`,`liberdade, igualdade, fraternidade, paz e ordem.`,`legalidade, interesse pessoal, moralidade, sigilo e eficiência.`,`hierarquia, disciplina, lucro, publicidade e rapidez.`],c:0,
 dica:`Lembre da palavra LIMPE.`,
 p:`LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.`,
 mais:`Legalidade: o servidor só faz o que a lei permite. Impessoalidade: trata todos igual, sem favorecer ninguém. Moralidade: age com honestidade. Publicidade: transparência. Eficiência: faz bem feito, sem desperdício.`},
{id:'ce2',a:'Específicos',x:``,
 q:`Um servidor atende primeiro um amigo que chegou depois de outras pessoas na fila. Ele desrespeitou principalmente o princípio da`,
 al:[`impessoalidade.`,`publicidade.`,`eficiência.`,`autonomia.`,`hierarquia.`],c:0,
 dica:`Qual princípio manda tratar todas as pessoas da mesma forma?`,
 p:`Impessoalidade: o servidor não pode favorecer nem prejudicar alguém por amizade ou interesse.`,
 mais:`Furar a fila de um amigo também fere a moralidade, mas o centro da questão é tratar pessoas de forma diferente por motivo pessoal: impessoalidade.`},
{id:'ce3',a:'Específicos',x:``,
 q:`A divulgação dos gastos da prefeitura em um portal da transparência atende ao princípio da`,
 al:[`publicidade.`,`impessoalidade.`,`pessoalidade.`,`sigilo.`,`hierarquia.`],c:0,
 dica:`Divulgar é tornar público…`,
 p:`Publicidade: os atos da administração devem ser divulgados, para a população acompanhar e fiscalizar.`,
 mais:`A publicidade tem exceções, como informações que põem em risco a segurança ou a intimidade das pessoas. Mas a regra é a transparência.`},
{id:'ce4',a:'Específicos',x:``,
 q:`Fazem parte da administração pública indireta`,
 al:[`autarquias, fundações públicas, empresas públicas e sociedades de economia mista.`,`apenas os ministérios e as secretarias municipais.`,`os partidos políticos.`,`as empresas privadas que vendem para a prefeitura.`,`os sindicatos.`],c:0,
 dica:`Indireta = entidades criadas pelo governo, com personalidade jurídica própria.`,
 p:`A administração indireta é formada por autarquias, fundações públicas, empresas públicas e sociedades de economia mista.`,
 mais:`A administração direta é a própria União, os estados, o DF e os municípios, com seus órgãos (ministérios, secretarias). A indireta são entidades separadas, criadas para áreas específicas.`},
{id:'ce5',a:'Específicos',x:``,
 q:`Os documentos usados com frequência no dia a dia do setor, guardados perto de quem trabalha com eles, formam o arquivo`,
 al:[`corrente.`,`permanente.`,`intermediário.`,`histórico.`,`morto.`],c:0,
 dica:`Pense em "corrente" como "em uso agora".`,
 p:`Arquivo corrente: documentos de uso frequente, que ficam no próprio setor.`,
 mais:`Teoria das três idades: corrente (uso frequente, no setor) → intermediário (uso raro, aguardando o prazo) → permanente (valor histórico ou de prova, guardado para sempre).`},
{id:'ce6',a:'Específicos',x:``,
 q:`Documentos com valor histórico, que devem ser guardados para sempre, pertencem ao arquivo`,
 al:[`permanente.`,`corrente.`,`intermediário.`,`provisório.`,`setorial.`],c:0,
 dica:`Para sempre = …`,
 p:`O arquivo permanente guarda documentos de valor histórico ou de prova. Eles não podem ser eliminados.`,
 mais:`No arquivo intermediário, os documentos esperam o fim do prazo. Depois, ou são eliminados (com autorização) ou vão para o permanente.`},
{id:'ce7',a:'Específicos',x:``,
 q:`Ao arquivar as fichas dos funcionários pelo nome, em ordem de A a Z, usa-se o método`,
 al:[`alfabético.`,`numérico.`,`geográfico.`,`cronológico.`,`ideográfico.`],c:0,
 dica:`De A a Z…`,
 p:`Organizar pelo nome, de A a Z, é o método alfabético.`,
 mais:`Outros métodos: numérico (por número), cronológico (por data), geográfico (por lugar) e ideográfico (por assunto).`},
{id:'ce8',a:'Específicos',x:``,
 q:`O setor responsável por receber, registrar, distribuir e controlar a tramitação dos documentos é o`,
 al:[`protocolo.`,`almoxarifado.`,`arquivo permanente.`,`recursos humanos.`,`tesouraria.`],c:0,
 dica:`É a "porta de entrada" dos documentos na repartição.`,
 p:`O protocolo recebe os documentos, registra (dá um número), distribui para os setores e acompanha por onde eles passam.`,
 mais:`Etapas do protocolo: recebimento, registro, autuação (quando vira processo), classificação, distribuição e controle da tramitação. Assim ninguém perde um documento de vista.`},
{id:'ce9',a:'Específicos',x:``,
 q:`Ao atender o telefone no trabalho, a atitude mais adequada é`,
 al:[`identificar o setor e o próprio nome e cumprimentar quem ligou.`,`dizer apenas "alô" e esperar a pessoa falar.`,`deixar tocar várias vezes antes de atender.`,`pedir que a pessoa ligue mais tarde, sem explicar.`,`passar a ligação sem perguntar quem é.`],c:0,
 dica:`Quem liga precisa saber logo com quem está falando.`,
 p:`O atendimento correto começa com identificação (setor e nome) e um cumprimento: "Secretaria de Educação, Ana, bom dia".`,
 mais:`Boas práticas: atender rápido, falar com clareza, anotar recados completos (nome, telefone, assunto, horário) e não deixar a pessoa esperando na linha sem retorno.`},
{id:'ce10',a:'Específicos',x:``,
 q:`Um cidadão chega irritado, reclamando da demora. A atitude mais adequada do servidor é`,
 al:[`ouvir com calma, mostrar que entendeu o problema e buscar uma solução.`,`responder no mesmo tom para mostrar autoridade.`,`ignorar a reclamação e chamar o próximo.`,`dizer que a culpa é de outro setor e encerrar a conversa.`,`pedir que ele volte outro dia, sem explicação.`],c:0,
 dica:`Pense em escuta e em solução.`,
 p:`Diante de alguém irritado, o servidor mantém a calma, ouve com atenção e busca resolver ou encaminhar o problema.`,
 mais:`Isso se chama escuta ativa: deixar a pessoa falar, repetir o que entendeu ("O senhor está esperando há uma hora, certo?") e dizer o que vai ser feito. Responder com grosseria só aumenta o conflito.`},
{id:'ce11',a:'Específicos',x:``,
 q:`Segundo o Manual de Redação da Presidência da República, o fecho usado para autoridades de hierarquia superior é`,
 al:[`Respeitosamente,`,`Atenciosamente,`,`Abraços,`,`Até mais,`,`Saudações cordiais,`],c:0,
 dica:`Para quem está acima na hierarquia, mostre respeito.`,
 p:`"Respeitosamente" é para autoridades superiores; "Atenciosamente", para as de mesma hierarquia ou inferior.`,
 mais:`O fecho é a despedida do documento. Nas comunicações oficiais, só existem esses dois. Expressões informais, como "Abraços", não cabem.`},
{id:'ce12',a:'Específicos',x:``,
 q:`Uma característica obrigatória da redação oficial é a`,
 al:[`impessoalidade.`,`linguagem com gírias.`,`opinião pessoal de quem escreve.`,`abreviação informal, como "vc".`,`linguagem rebuscada e difícil.`],c:0,
 dica:`O documento fala em nome do órgão, e não da pessoa.`,
 p:`A redação oficial deve ser impessoal, clara, concisa e formal.`,
 mais:`Impessoal: fala em nome do órgão. Clara: qualquer pessoa entende. Concisa: diz o necessário, sem enrolar. Formal: segue a norma-padrão. Linguagem difícil demais também é erro, porque atrapalha a clareza.`}
];
