  const dados = JSON.stringify({app:'Estudo Guará', versao:1, gerado:agora.toISOString(), nome:S.nome || '', estado:S}).replace(/</g, '\\u003c');
  const totalAulas = CURSO_KEYS.reduce((s, k) => s + CURSOS[k].aulas.filter(a => S.aulas[a.id]).length, 0);
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatório Estudo Guará · ${nome}</title><style>${REL_CSS}</style></head><body>
<h1>Relatório de estudo · ${nome}</h1>
<p class="meta">Concurso Prefeitura de Guaratinguetá (VUNESP) e cursos · gerado em ${quando}</p>
<div class="tiles"><div class="tile"><b>${Object.keys(S.days).filter(studied).length}</b><span>dias estudados</span></div><div class="tile"><b>${totalAulas}</b><span>aulas feitas</span></div><div class="tile"><b>${D.tq}</b><span>perguntas respondidas</span></div><div class="tile"><b>${D.tq ? pct(D.tok, D.tq) + '%' : '—'}</b><span>certas de primeira</span></div><div class="tile"><b>${S.sims.length}</b><span>simulados</span></div></div>
<div class="note"><b>Leitura rápida</b><ul>${relLeitura(D).map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
<h2>Evolução semana a semana</h2>
${tab('<th>Semana</th><th class="n">Dias</th><th class="n">Aulas</th><th class="n">Perguntas</th><th class="n">De primeira</th>', semanas, 'Ainda sem estudo registrado.')}
<h2>Aulas dos cursos</h2>${aulas}
<h2>Concurso por matéria</h2>
${tab('<th>Matéria</th><th class="n">Na prova</th><th class="n">Respostas</th><th class="n">De primeira</th>', conc, '')}
<h2>Simulados</h2>
${tab('<th>Data</th><th class="n">Questões</th><th class="n">Certas</th><th class="n">Erradas</th><th class="n">Branco</th><th class="n">Acerto</th><th class="n">Tempo</th>', sims, 'Nenhum simulado ainda.')}
<h2>Perguntas que errou ou acertou só na segunda tentativa</h2>
${tab('<th>Data</th><th>Onde</th><th>Pergunta</th><th>Marcou primeiro</th><th>Certa</th>', erros, 'Nenhuma ainda.')}
<footer>Os dados completos estão guardados dentro deste arquivo, para análise. Material de estudo independente, sem vínculo com a Prefeitura ou com a VUNESP.</footer>
<script type="application/json" id="dados-brutos">${dados}<\/script>
</body></html>`;
}
function relTexto(){
  const D = relDados(), L2 = [`Relatório Estudo Guará · ${S.nome || 'Estudante'} · ${fmtD(D.t)}`];
  L2.push(`Dias estudados: ${Object.keys(S.days).filter(studied).length} (nos últimos 7 dias: ${D.ult7})`);
  CURSO_KEYS.forEach(k => { const c = CURSOS[k]; L2.push(`${c.nome}: ${c.aulas.filter(a => S.aulas[a.id]).length}/${c.aulas.length} aulas`); });
  L2.push(`Perguntas: ${D.tq}, ${D.tq ? pct(D.tok, D.tq) : 0}% de primeira`);
  D.conc.filter(x => x.n).forEach(x => L2.push(`- ${x.m}: ${pct(x.ok, x.n)}% de primeira (${x.n})`));
  if (S.sims.length) L2.push(`Último simulado: ${S.sims[0].c} de ${S.sims[0].n}`);
  if (D.erros.length){ L2.push('', 'Erros recentes:'); D.erros.slice(0, 8).forEach(e => L2.push(`- ${e.q.q} → certa: ${e.q.al[e.q.c]}`)); }
  return L2.join('\n');
}
function relEnviar(){
  const st = $('#rel-status');
  const slug = (S.nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  const f = new File([relHTML()], `relatorio-guara${slug ? '-' + slug : ''}-${today()}.html`, {type:'text/html'});
  const baixar = () => {
    const u = URL.createObjectURL(f), a = document.createElement('a');
    a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    st.textContent = `Arquivo ${f.name} gerado. No iPhone ele fica no app Arquivos, em Downloads. Se nada apareceu, use "Copiar resumo em texto".`;
  };
  if (navigator.canShare && navigator.canShare({files:[f]})){
    navigator.share({files:[f], title:'Relatório Estudo Guará'})
      .then(() => { st.textContent = 'Pronto: o relatório foi para o app que você escolheu.'; })
      .catch(e => { if (e && e.name === 'AbortError') st.textContent = 'Envio cancelado.'; else baixar(); });
  } else baixar();
}
function relCopiar(){
  const txt = relTexto(), st = $('#rel-status');
  const mostrar = () => { st.innerHTML = 'Copie o texto abaixo:<textarea class="reltxt" readonly aria-label="Resumo do relatório"></textarea>'; const ta = st.querySelector('textarea'); ta.value = txt; ta.focus(); ta.select(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { st.textContent = 'Resumo copiado. É só colar no WhatsApp.'; }, mostrar);
  else mostrar();
}

/* ---------- desenho e eventos ---------- */
function render(){
  const full = !!(quiz || sim);
  nav.hidden = full;
  app.innerHTML = quiz ? (quiz.fim ? viewFimQuiz() : viewQuiz())
    : sim ? (sim.end ? viewSimEnd() : viewSim())
    : tab === 'conc' ? (cursoAtual ? viewCurso(cursoAtual) : viewConc()) : tab === 'cursos' ? viewCursos() : viewProg();
  nav.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-current', !full && b.dataset.tab === tab ? 'page' : 'false'));
  tick();
}
function fmtLeft(t0, dur){ const rem = dur - Math.floor((Date.now() - t0) / 1000); return rem <= 0 ? 'tempo ✓' : Math.floor(rem / 60) + ':' + pad(rem % 60); }
function tick(){
  if (sim && !sim.end && sim.auto && Date.now() - sim.t0 >= sim.dur * 1000){ finishSim(true); render(); scrollTo(0, 0); return; }
  document.querySelectorAll('.timer[data-t0]').forEach(el => { el.textContent = fmtLeft(+el.dataset.t0, +el.dataset.dur); });
}
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb){ tab = tb.dataset.tab; aulaSel = null; cursoAtual = null; resetArm = false; render(); scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'aula'){
    const k = b.dataset.curso; quiz = null; aulaSel = {curso:k, id:b.dataset.id, mais:S.modo === 'completo'};
    if (CURSOS[k].concurso){ tab = 'conc'; cursoAtual = k; } else { tab = 'cursos'; cursoTab = k; cursoAtual = null; }
    render(); scrollTo(0, 0);
  } else if (act === 'voltar-curso'){ aulaSel = null; render(); scrollTo(0, 0);
  } else if (act === 'curso'){ quiz = null; aulaSel = null; tab = 'conc'; cursoAtual = b.dataset.curso; render(); scrollTo(0, 0);
  } else if (act === 'abrir-curso'){ quiz = null; aulaSel = null; cursoAtual = null; tab = 'cursos'; cursoTab = b.dataset.curso; render(); scrollTo(0, 0);
  } else if (act === 'ir-conc'){ aulaSel = null; cursoAtual = null; tab = 'conc'; render(); scrollTo(0, 0);
  } else if (act === 'mais'){ aulaSel.mais = !aulaSel.mais; render();
  } else if (act === 'praticar'){
    const a = CURSOS[aulaSel.curso].aulas.find(x => x.id === aulaSel.id);
    novoQuiz(a.qs.map(q => q.id), 'aula', {aula:a.id, curso:aulaSel.curso});
  } else if (act === 'treino'){
    const mat = b.dataset.mat; quiz = null;
    novoQuiz(mat ? pickConc(mat, 5) : pickMisto(MISTO10), 'conc', {mat});
  } else if (act === 'pick'){
    if (quiz.done) return;
    quiz.sel = +b.dataset.o;
    app.querySelectorAll('.alt:not(:disabled)').forEach(x => { const on = +x.dataset.o === quiz.sel; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    const r = $('#responder'); if (r) r.disabled = false;
  } else if (act === 'responder'){ responder();
  } else if (act === 'q-mais'){ quiz.showMais = true; render();
  } else if (act === 'proxima'){ proxima();
  } else if (act === 'sair-quiz'){
    if (quiz.res.length && !quiz.fim) fimQuiz(); else { quiz = null; render(); scrollTo(0, 0); }
  } else if (act === 'fim-ok'){ quiz = null; tab = 'conc'; render(); scrollTo(0, 0);
  } else if (act === 'sim'){ quiz = null; startSim(+b.dataset.n === 20 ? MISTO20 : MISTO10);
  } else if (act === 's-pick'){
    const id = sim.ids[sim.i], o = +b.dataset.o;
    if (sim.ans[id] === o) delete sim.ans[id]; else sim.ans[id] = o;
    app.querySelectorAll('.alt').forEach(x => { const on = +x.dataset.o === sim.ans[id]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    const pr = app.querySelector('.qprog span'); if (pr) pr.textContent = `${sim.i + 1} de ${sim.ids.length} · ${Object.keys(sim.ans).length} marcadas`;
  } else if (act === 's-next' || act === 's-prev'){ sim.i += act === 's-next' ? 1 : -1; render(); scrollTo(0, 0);
  } else if (act === 's-finish'){ finishSim(false); render(); scrollTo(0, 0);
  } else if (act === 's-quit'){ sim = null; render(); scrollTo(0, 0);
  } else if (act === 's-close'){ sim = null; tab = 'conc'; render(); scrollTo(0, 0);
  } else if (act === 'rel-enviar'){ relEnviar();
  } else if (act === 'rel-copiar'){ relCopiar();
  } else if (act === 'reset'){
    if (!resetArm){ resetArm = true; b.textContent = 'Toque de novo para apagar tudo'; setTimeout(() => { resetArm = false; const r = $('#reset'); if (r) r.textContent = 'Apagar meu progresso'; }, 4000); }
    else { S = fresh(); save(); aplicarLetra(); resetArm = false; render(); }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'auto-end'){ S.autoEnd = el.checked; save(); }
  else if (el.id === 'modo-completo'){ S.modo = el.checked ? 'completo' : 'simples'; save(); }
  else if (el.id === 'letra-maior'){ S.big = el.checked; save(); aplicarLetra(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'nome'){ S.nome = ev.target.value.trim().slice(0, 40); save(); }
});

aplicarLetra();
render();
setInterval(tick, 1000);
</script>
