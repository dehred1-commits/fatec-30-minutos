const por10 = x => Math.round(x.net / x.n * 100) / 10;
function relDados(){
  const t = today(), dias = new Set([...Object.keys(S.days), ...Object.keys(S.red)]), sem = {};
  const linha = k => { const w = semanaDe(k); return sem[w] || (sem[w] = {dias:0, q:0, ok:0, pr:0, prok:0, red:0, sims:0, soma10:0}); };
  dias.forEach(k => {
    const s = linha(k), d = S.days[k] || {}, r = S.red[k];
    if (studied(k)) s.dias++;
    s.q += d.q || 0; s.ok += d.ok || 0; s.pr += d.pr || 0; s.prok += d.prok || 0;
    if (r && r.length === 3 && r.every(Boolean)) s.red++;
  });
  S.sims.forEach(x => { const s = linha(x.date); s.sims++; s.soma10 += por10(x); });
  const by = {}; ORDEM.forEach(c => by[c] = {an:0, aok:0, pn:0, pok:0});
  for (const c in S.ar) if (by[c]){ by[c].an = S.ar[c].n; by[c].aok = S.ar[c].ok; }
  const provas = [];
  EDS.forEach(e => {
    const st = S.pr[e.id]; if (!st) return;
    let n = 0, net = 0, c = 0, w = 0, br = 0; const errs = [];
    Object.keys(st.c).map(Number).sort((x, y) => x - y).forEach(q => {
      const a = st.a[q], k = e.k[q - 1], p = pts(e, q, a), b = by[e.s[q - 1]]; n++; net += p;
      if (p > 0) c++; else if (p < 0){ w++; errs.push({q, mat:MAT[e.s[q - 1]], marcou:a, certa:k}); } else br++;
      if (b && a && k !== 'X'){ b.pn++; if (a === k) b.pok++; }
    });
    const blocos = e.blocos.map(([a, b, nome, min]) => { let s = 0, m = 0; for (let q = a; q <= b; q++) if (st.c[q]){ m++; s += pts(e, q, st.a[q]); } return {nome, a, b, min, s, m}; });
    if (n) provas.push({nome:e.nome, n, net, c, w, br, errs, blocos, min:e.min});
  });
  const erros = S.log.filter(l => !l[2]).slice(-60).reverse().map(([d, id, , ch, kind, chute]) => { const q = QM[id]; return q ? {d, q, ch, kind, chute} : null; }).filter(Boolean);
  const comLog = new Set(S.log.map(l => l[1]));
  const errosSemLog = Object.keys(S.qs).filter(id => !S.qs[id].lastOk && !comLog.has(id) && QM[id]).map(id => QM[id]);
  const maisErrados = Object.keys(S.qs).map(id => ({q:QM[id], e:S.qs[id].n - S.qs[id].ok, n:S.qs[id].n})).filter(x => x.q && x.e > 1).sort((a, b) => b.e - a.e).slice(0, 10);
  let tq = 0, tok = 0, tp = 0;
  for (const d of Object.values(S.days)){ tq += d.q || 0; tok += d.ok || 0; tp += d.pr || 0; }
  let ult7 = 0; for (let i = 0; i < 7; i++) if (studied(addDays(t, -i))) ult7++;
  const ch = S.sims.reduce((s, x) => ({c:s.c + (x.cc || 0), w:s.w + (x.cw || 0), b:s.b + (x.b || 0), n:s.n + x.n}), {c:0, w:0, b:0, n:0});
  return {t, semanas:Object.keys(sem).sort().map(w => ({w, ...sem[w]})), by, provas, erros, errosSemLog, maisErrados, ch, tq, tok, tp, ult7,
    discursivas:Object.keys(S.red).filter(k => S.red[k].length === 3 && S.red[k].every(Boolean)).sort(),
    diasEst:[...dias].filter(studied).length, seq:streak(), rev:Object.values(S.qs).filter(r => r.due).length, left:S.exam ? diffDays(t, S.exam) : null};
}
function relLeitura(D){
  const L = [];
  const mats = ORDEM.map(c => { const b = D.by[c], n = b.an + b.pn; return {c, n, p:acc(b.aok + b.pok, n)}; }).filter(x => x.n >= 4).sort((x, y) => x.p - y.p);
  if (mats.length) L.push(`Matéria mais fraca: ${MAT[mats[0].c]}, com ${mats[0].p}% de acerto em ${mats[0].n} itens.`);
  if (mats.length > 1){ const m = mats[mats.length - 1]; L.push(`Matéria mais forte: ${MAT[m.c]}, com ${m.p}% em ${m.n} itens.`); }
  const tr = D.by.T, trn = tr.an + tr.pn;
  if (trn) L.push(`Legislação de trânsito, o maior bloco da prova: ${acc(tr.aok + tr.pok, trn)}% de acerto em ${trn} itens.`);
  const s = D.semanas.filter(x => x.q > 0);
  if (s.length >= 2){
    const a = s[s.length - 2], b = s[s.length - 1], pa = acc(a.ok, a.q), pb = acc(b.ok, b.q);
    L.push(`Acerto ${pb > pa ? 'subiu' : pb < pa ? 'caiu' : 'se manteve'}: ${pa}% na semana de ${fmtD(a.w)} e ${pb}% na de ${fmtD(b.w)}.`);
  }
  if (S.sims.length >= 2){
    const ult = S.sims[0], pri = S.sims[S.sims.length - 1];
    L.push(`Nota líquida por 10 itens nos simulados: ${por10(pri)} no primeiro (${fmtD(pri.date)}) e ${por10(ult)} no último (${fmtD(ult.date)}).`);
  }
  const saldo = D.ch.c - D.ch.w;
  if (D.ch.c + D.ch.w) L.push(`Nos simulados, os chutes somaram ${saldo > 0 ? '+' : ''}${saldo} (${D.ch.c} certos, ${D.ch.w} errados)${saldo < 0 ? ': está chutando demais, deixar em branco renderia mais' : saldo > 0 ? ': chutar com algum conhecimento está compensando' : ''}.`);
  if (D.ch.n) L.push(`Deixou ${D.ch.b} de ${D.ch.n} itens em branco nos simulados (${acc(D.ch.b, D.ch.n)}%).`);
  L.push(`Estudou em ${D.ult7} dos últimos 7 dias.`);
  if (D.left != null && D.left > 0) L.push(`Faltam ${D.left} dias para a prova (data marcada no app).`);
  else if (D.left == null) L.push('A data da prova ainda não foi marcada no app.');
  return L;
}

}

  };
  if (navigator.canShare && navigator.canShare({files:[f]})){

  } else baixar();
}

function fmtLeft(t0, dur){ const rem = dur - Math.floor((Date.now() - t0) / 1000); return rem <= 0 ? 'tempo ✓' : Math.floor(rem / 60) + ':' + pad(rem % 60); }
function tick(){
  if (sim && !sim.end && sim.auto && Date.now() - sim.t0 >= sim.dur * 1000){ finishSim(true); render(); scrollTo(0, 0); return; }
  document.querySelectorAll('.timer[data-t0]').forEach(el => { el.textContent = fmtLeft(+el.dataset.t0, +el.dataset.dur); });
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb){ tab = tb.dataset.tab; resetArm = false; render(); scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'start'){
    const f = FOCO[parseKey(today()).getDay()];
    startDaily(+b.dataset.n || 12, f ? f.areas : [], !!b.dataset.rev);
  } else if (act === 'ce'){
    const v = b.dataset.v;
    if (sess && !sess.revealed){
      sess.chosen = v;
      app.querySelectorAll('.ce').forEach(x => { const on = x.dataset.v === v; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
      $('#confirmar').disabled = false;
    } else if (sim && !sim.end){
      const id = sim.ids[sim.i];
      if (v === 'B' || sim.ans[id] === v) delete sim.ans[id]; else sim.ans[id] = v;
      const cur = sim.ans[id] || 'B';
      app.querySelectorAll('.ce').forEach(x => { const on = x.dataset.v === cur && cur !== 'B'; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
      const pr = app.querySelector('.qprog span'); if (pr) pr.textContent = `${sim.i + 1} de ${sim.ids.length} · ${Object.keys(sim.ans).length} marcados`;
    }
  } else if (act === 'confirm'){
    if (sess.chosen == null || sess.revealed) return;
    const q = QM[sess.ids[sess.i]], ok = sess.chosen === q.g;
    sess.revealed = true; sess.res.push({id:q.id, ok}); record(q, ok, sess.chosen, 'dia'); bumpDay('q', ok ? 1 : 0, 1); save(); render();
  } else if (act === 'next'){
    sess.i++;
    if (sess.i >= sess.ids.length){ sess.end = true; closeSess(); } else { sess.chosen = null; sess.revealed = false; }
    render(); scrollTo(0, 0);
  } else if (act === 'quit'){
    if (sess.res.length){ sess.end = true; closeSess(); } else sess = null;
    render(); scrollTo(0, 0);
  } else if (act === 'home'){
    sess = null; tab = 'hoje'; render(); scrollTo(0, 0);
  } else if (act === 'sim'){
    startSim(+b.dataset.n || 20);
  } else if (act === 'sim-next' || act === 'sim-prev'){
    sim.i += act === 'sim-next' ? 1 : -1; render(); scrollTo(0, 0);
  } else if (act === 'sim-finish'){
    finishSim(); render(); scrollTo(0, 0);
  } else if (act === 'sim-quit'){
    sim = null; render(); scrollTo(0, 0);
  } else if (act === 'sim-close'){
    sim = null; tab = 'simulados'; render(); scrollTo(0, 0);
  } else if (act === 'sun-prova'){
    tab = 'simulados'; provaSel = {id:'2021', from:56, to:75, t0:Date.now()}; render(); scrollTo(0, 0);
  } else if (act === 'ed-open'){
    provaSel = {id:b.dataset.id, from:1, to:20, t0:Date.now()}; render(); scrollTo(0, 0);
  } else if (act === 'ed-back'){
    provaSel = null; render(); scrollTo(0, 0);
  } else if (act === 'blk'){
    provaSel.from = +b.dataset.f; provaSel.to = +b.dataset.t; provaSel.t0 = Date.now(); render();
  } else if (act === 'mark'){
    const st = prState(provaSel.id), q = +b.dataset.q, l = b.dataset.l;
    if (st.c[q]) return;
    if (st.a[q] === l) delete st.a[q]; else st.a[q] = l;
    save();
    b.closest('.crow').querySelectorAll('.bub-btn').forEach(x => { const on = x.dataset.l === st.a[q]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    const c = $('#corrigir'); if (c) c.disabled = false;
  } else if (act === 'corrigir'){
    const e = edById(provaSel.id), st = prState(e.id); let n = 0, ok = 0;
    for (let q = provaSel.from; q <= provaSel.to; q++){ if (st.c[q]) continue; st.c[q] = today(); n++; if (pts(e, q, st.a[q]) > 0) ok++; }
    bumpDay('pr', ok, n); save(); render();
    const r = $('#res'); if (r) r.scrollIntoView({block:'start'});
  } else if (act === 'refazer'){
    const st = prState(provaSel.id);
    for (let q = provaSel.from; q <= provaSel.to; q++){ delete st.a[q]; delete st.c[q]; }
    provaSel.t0 = Date.now(); save(); render();
  } else if (act === 'rel-enviar'){
    relEnviar();
  } else if (act === 'rel-copiar'){
    relCopiar();
  } else if (act === 'reset'){
    if (!resetArm){ resetArm = true; b.textContent = 'Toque de novo para apagar tudo'; setTimeout(() => { resetArm = false; const r = $('#reset'); if (r) r.textContent = 'Apagar meu progresso'; }, 4000); }
    else { S = fresh(); save(); resetArm = false; render(); }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'exam-date'){ S.exam = el.value || ''; save(); render(); return; }
  if (el.id === 'auto-end'){ S.autoEnd = el.checked; save(); return; }
  if (el.id === 'chute' && sim){ const id = sim.ids[sim.i]; if (el.checked) sim.chute[id] = true; else delete sim.chute[id]; return; }
  if (el.dataset && el.dataset.red != null){
    const t = today(), r = S.red[t] || [false, false, false];
    r[+el.dataset.red] = el.checked; S.red[t] = r; save(); render();
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'nome'){ S.nome = ev.target.value.trim().slice(0, 40); save(); }
});

render();
setInterval(tick, 1000);
</script>

</body>
</html>
