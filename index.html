// Prioriza as questões nunca vistas; depois as que ela errou; depois as vistas há mais tempo.
function pickSim(porMateria){
  let ids = [];
  AREAS.forEach(a => {
    const pool = shuffle(Q.filter(q => q.a === a));
    const nunca = pool.filter(q => !S.qs[q.id]);
    const vistas = pool.filter(q => S.qs[q.id]).sort((x, y) => {
      const r = S.qs[x.id], s = S.qs[y.id];
      if (r.lastOk !== s.lastOk) return r.lastOk ? 1 : -1;
      return r.last < s.last ? -1 : r.last > s.last ? 1 : 0;
    });
    ids = ids.concat([...nunca, ...vistas].slice(0, porMateria).map(q => q.id));
  });
  return ids;
}
function startSim(porMateria){
  const ids = pickSim(porMateria), perm = {};
  ids.forEach(id => { perm[id] = QM[id].o ? [0, 1, 2, 3, 4] : shuffle([0, 1, 2, 3, 4]); });
  sim = {ids, perm, i:0, ans:{}, t0:Date.now(), dur:ids.length * 180, auto:S.autoEnd !== false, end:false};
  render(); scrollTo(0, 0);
}
function finishSim(timeout){
  const t = today(); let c = 0, w = 0, b = 0;
  sim.ids.forEach(id => {
    const q = QM[id], a = sim.ans[id];
    if (a == null){ b++; record(q, false, null, 'sim'); return; }
    const ok = a === q.c; if (ok) c++; else w++;
    record(q, ok, a, 'sim');
  });
  sim.end = true;
  sim.result = {c, w, b, n:sim.ids.length, min:Math.max(1, Math.round((Date.now() - sim.t0) / 60000)), timeout:!!timeout};
  S.sims.unshift({date:t, ...sim.result, items:sim.ids.map(id => [id, sim.ans[id] == null ? null : sim.ans[id]])});
  S.sims = S.sims.slice(0, 40);
  S.ses.push({d:t, k:'sim', n:sim.result.n, ok:c, min:sim.result.min});
  if (S.ses.length > 300) S.ses = S.ses.slice(-300);
  save();
}

function newPerm(){ const q = QM[sess.ids[sess.i]]; sess.perm = q.o ? [0, 1, 2, 3, 4] : shuffle([0, 1, 2, 3, 4]); }
function startSession(n, areas, rev){
  const t = today(), ids = buildSession(areas, n, rev);
  sess = {ids, i:0, res:[], chosen:null, revealed:false, t0:Date.now(), end:false, rev:!!rev,
    tags: ids.map(id => { const r = S.qs[id]; return r && r.due && r.due <= t ? 'REVISÃO' : r ? 'REPETIDA' : ''; })};
  newPerm(); render(); scrollTo(0, 0);
}
function record(q, ok, ch, kind){
  const t = today(), r = S.qs[q.id] || {n:0, ok:0, step:0};
  S.log.push([t, q.id, ok ? 1 : 0, ch, kind || 'dia']);
  if (S.log.length > 2000) S.log = S.log.slice(-2000);
  r.n++; if (ok) r.ok++; r.last = t; r.lastOk = ok;
  if (!ok){ r.due = addDays(t, 1); r.step = 0; }
  else if (r.due){ if (r.step >= 1) r.due = null; else { r.due = addDays(t, 3); r.step = 1; } }
  S.qs[q.id] = r;
  const a = S.ar[q.a] || {n:0, ok:0}; a.n++; if (ok) a.ok++; S.ar[q.a] = a;
  bumpDay('q', ok ? 1 : 0, 1);
  save();
}

  const blocks = []; for (let f = 1; f <= tot; f += 10) blocks.push([f, Math.min(tot, f + 9)]); blocks.push([1, tot]);
  const chips = blocks.map(([f, t]) => {
    const on = f === from && t === to, label = f === 1 && t === tot ? 'Inteira' : `${f}–${t}`;
    let done = true; for (let q = f; q <= t; q++) if (!st.c[q]){ done = false; break; }
    return `<button class="chip-btn${on ? ' on' : ''}${done ? ' done' : ''}" data-act="blk" data-f="${f}" data-t="${t}" aria-pressed="${on}">${label}${done ? ' ✓' : ''}</button>`;
  }).join('');
  let rows = '', anyMarked = false, corrected = 0, ok = 0; const errs = [], subErr = {};
  for (let q = from; q <= to; q++){
    const k = e.k[q - 1], sc = e.s[q - 1], a = st.a[q], c = !!st.c[q];
    if (a && !c) anyMarked = true;
    let right = false;
    if (c){ corrected++; right = isRight(e, q, a); if (right) ok++; else { errs.push(q); subErr[sc] = (subErr[sc] || 0) + 1; } }
    const bubs = [...L].map(l => {
      let cls = 'bub-btn';
      if (c){ if (k !== '-' && l === k) cls += ' right'; else if (l === a) cls += k === '-' ? ' sel' : ' wrong'; }
      else if (l === a) cls += ' sel';
      return `<button class="${cls}" data-act="mark" data-q="${q}" data-l="${l}" aria-label="Questão ${q}, alternativa ${l}" aria-pressed="${l === a}" ${c ? 'disabled' : ''}>${l}</button>`;
    }).join('');
    const note = c && k === '-' ? '<span class="anul">anulada</span>' : c && !a ? '<span class="anul">em branco</span>' : '';
    rows += `<li class="crow${c ? (right ? ' is-ok' : ' is-bad') : ''}"><span class="qn">${pad(q)}</span><span class="qs">${ABR[sc] || ''}</span><span class="bubs">${bubs}</span>${note}</li>`;
  }
  const n = to - from + 1, allDone = corrected === n;
  const res = corrected ? `<section class="card" id="res">
      <p class="eyebrow">Resultado · questões ${from} a ${to}</p>
      <p class="big-score">${ok} <span>de ${corrected} corrigidas</span></p>
      ${errs.length ? `<p class="meta">Errou: ${errs.map(q => `${pad(q)} (${ABR[e.s[q - 1]]}, certa ${e.k[q - 1]})`).join(' · ')}</p>` : '<p class="done-line">Gabaritou o bloco.</p>'}
      ${Object.keys(subErr).map(sc => `<p class="tipline"><b>${MAT[sc]}</b>: ${esc(DICA_MAT[sc])}</p>`).join('')}
      ${errs.length ? '<p class="meta">Volte ao caderno nas que errou e procure no texto a palavra que leva à resposta certa.</p>' : ''}
      <button class="link" data-act="refazer">Refazer este bloco</button>
    </section>` : '';
  return `<button class="link" data-act="ed-back">← Todas as provas</button>
    <header class="hero"><p class="eyebrow">Prova oficial · ${e.nome}${e.data ? ' · ' + e.data : ''}</p>
      <h1 class="h1-sm">Tema central: ${esc(e.tema)}</h1><p class="sub">Redação: ${esc(e.red)}.</p></header>
    <div class="links">
      <a class="ghost" href="${S3 + e.pid}/Prova.pdf" target="_blank" rel="noopener">Abrir caderno de questões (PDF) ↗</a>
      <a class="link" href="${S3 + e.pid}/${e.g}.pdf" target="_blank" rel="noopener">Gabarito oficial (PDF) ↗</a>
    </div>
    <div class="chips" role="group" aria-label="Escolha o bloco de questões">${chips}</div>
    ${res}
    <section class="card">
      <div class="cartao-head"><p class="eyebrow">Cartão-resposta · ${from} a ${to}</p><span class="timer" data-t0="${provaSel.t0}" data-dur="${n * 180}"></span></div>
      <ol class="crows">${rows}</ol>
      ${allDone ? '' : `<button class="primary" id="corrigir" data-act="corrigir" ${anyMarked ? '' : 'disabled'}>${corrected ? 'Corrigir o que falta' : 'Corrigir'}</button>`}
      <p class="meta">Tempo sugerido: 3 minutos por questão. Na correção, questão em branco conta como erro, igual na prova.</p>
    </section>`;
}

const semanaDe = k => addDays(k, -((parseKey(k).getDay() + 6) % 7));
const acc = (ok, n) => n ? Math.round(ok / n * 100) : null;
const fmtPct = p => p == null ? '—' : p + '%';
const limpa = s => String(s || '').replace(/[⟦⟧]/g, '');

function relDados(){
  const t = today(), dias = new Set([...Object.keys(S.days), ...Object.keys(S.red)]), sem = {};
  dias.forEach(k => {
    const w = semanaDe(k), s = sem[w] || (sem[w] = {dias:0, q:0, ok:0, pr:0, prok:0, red:0});
    const d = S.days[k] || {}, r = S.red[k];
    if (studied(k)) s.dias++;
    s.q += d.q || 0; s.ok += d.ok || 0; s.pr += d.pr || 0; s.prok += d.prok || 0;
    if (r && r.length === 3 && r.every(Boolean)) s.red++;
  });
  const by = {}; AREAS.forEach(a => by[a] = {an:0, aok:0, pn:0, pok:0});
  for (const a in S.ar) if (by[a]){ by[a].an = S.ar[a].n; by[a].aok = S.ar[a].ok; }
  const provas = [];
  EDS.forEach(e => {
    const st = S.pr[e.id]; if (!st) return;
    let n = 0, ok = 0; const errs = [];
    Object.keys(st.c).map(Number).sort((x, y) => x - y).forEach(q => {
      const sc = e.s[q - 1], k = e.k[q - 1], right = isRight(e, q, st.a[q]); n++;
      if (right) ok++; else errs.push({q, mat:MAT[sc] || '', marcou:st.a[q] || 'em branco', certa:k});
      const b = by[MAT[sc]]; if (b && k !== '-'){ b.pn++; if (right) b.pok++; }
    });
    if (n) provas.push({nome:e.nome, tema:e.tema, n, ok, errs});
  });
  const erros = S.log.filter(l => !l[2]).slice(-60).reverse().map(([d, id, , ch, kind]) => {
    const q = QM[id]; if (!q) return null;
    return {d, q, kind, marcou:ch == null ? '' : q.al[ch], pegadinha:ch != null && ch === q.ar[0]};
  }).filter(Boolean);
  const comLog = new Set(S.log.map(l => l[1]));
  const errosSemLog = Object.keys(S.qs).filter(id => !S.qs[id].lastOk && !comLog.has(id) && QM[id]).map(id => QM[id]);
  const maisErradas = Object.keys(S.qs).map(id => ({q:QM[id], e:S.qs[id].n - S.qs[id].ok, n:S.qs[id].n})).filter(x => x.q && x.e > 1).sort((a, b) => b.e - a.e).slice(0, 10);
  let tq = 0, tok = 0, tp = 0, tpok = 0;
  for (const d of Object.values(S.days)){ tq += d.q || 0; tok += d.ok || 0; tp += d.pr || 0; tpok += d.prok || 0; }
  let ult7 = 0; for (let i = 0; i < 7; i++) if (studied(addDays(t, -i))) ult7++;
  return {t, semanas:Object.keys(sem).sort().map(w => ({w, ...sem[w]})), by, provas, erros, errosSemLog, maisErradas,
    redacoes:Object.keys(S.red).filter(k => S.red[k].length === 3 && S.red[k].every(Boolean)).sort(),
    tq, tok, tp, tpok, ult7, diasEst:[...dias].filter(studied).length, seq:streak(), rev:Object.values(S.qs).filter(r => r.due).length, left:diffDays(t, EXAM_KEY)};
}
function relLeitura(D){
  const L = [];
  const mats = AREAS.map(a => { const b = D.by[a], n = b.an + b.pn; return {a, n, p:acc(b.aok + b.pok, n)}; }).filter(x => x.n >= 4).sort((x, y) => x.p - y.p);
  if (mats.length) L.push(`Matéria mais fraca: ${mats[0].a}, com ${mats[0].p}% de acerto em ${mats[0].n} questões.`);
  if (mats.length > 1){ const m = mats[mats.length - 1]; L.push(`Matéria mais forte: ${m.a}, com ${m.p}% em ${m.n} questões.`); }
  const s = D.semanas.filter(x => x.q + x.pr > 0);
  if (s.length >= 2){
    const a = s[s.length - 2], b = s[s.length - 1], pa = acc(a.ok + a.prok, a.q + a.pr), pb = acc(b.ok + b.prok, b.q + b.pr);
    L.push(`Acerto ${pb > pa ? 'subiu' : pb < pa ? 'caiu' : 'se manteve'}: ${pa}% na semana de ${fmtD(a.w)} e ${pb}% na de ${fmtD(b.w)}.`);
  }
  L.push(`Estudou em ${D.ult7} dos últimos 7 dias.`);
  if (D.erros.length >= 5){
    const p = D.erros.filter(e => e.pegadinha).length;
    L.push(`Marcou a pegadinha principal em ${p} dos ${D.erros.length} erros registrados${p / D.erros.length >= .4 ? ': a dificuldade parece estar na leitura das alternativas, mais do que no conteúdo' : ''}.`);
  }
  if (S.sims.length >= 2){
    const ult = S.sims[0], pri = S.sims[S.sims.length - 1];
    L.push(`Simulados do app: ${pct(pri.c, pri.n)}% no primeiro (${fmtD(pri.date)}) e ${pct(ult.c, ult.n)}% no último (${fmtD(ult.date)}).`);
  } else if (S.sims.length === 1) L.push(`Fez 1 simulado do app: ${S.sims[0].c} de ${S.sims[0].n} (${pct(S.sims[0].c, S.sims[0].n)}%).`);
  else L.push('Ainda não fez nenhum simulado do app.');
  const brancos = S.sims.reduce((s, x) => s + (x.b || 0), 0);
  if (brancos) L.push(`Deixou ${brancos} ${brancos === 1 ? 'questão' : 'questões'} em branco nos simulados. Na Fatec, erro não desconta: vale sempre responder.`);
  if (!D.provas.length) L.push('Ainda não corrigiu nenhum bloco das provas oficiais.');
  if (D.left > 0) L.push(`Faltam ${D.left} dias para a prova.`);
  return L;
}

    const tend = p == null || ant == null ? '' : p > ant ? '<span class="up">▲</span>' : p < ant ? '<span class="down">▼</span>' : '=';
    if (p != null) ant = p;
    return `<tr><td>${fmtD(s.w)} a ${fmtD(addDays(s.w, 6))}</td><td class="n">${s.dias}</td><td class="n">${s.q}</td><td class="n">${fmtPct(acc(s.ok, s.q))}</td><td class="n">${s.pr}</td><td class="n">${fmtPct(acc(s.prok, s.pr))}</td><td class="n">${s.red}</td><td class="n">${tend}</td></tr>`;
  }).join('');
  const mats = AREAS.map(a => {
    const b = D.by[a], tot = acc(b.aok + b.pok, b.an + b.pn);
    return `<tr><td>${a}</td><td class="n">${NA_PROVA[a]}</td><td class="n">${b.an}</td><td class="n">${fmtPct(acc(b.aok, b.an))}</td><td class="n">${b.pn}</td><td class="n">${fmtPct(acc(b.pok, b.pn))}</td><td class="n${tot != null && tot < 50 ? ' bad' : ''}"><b>${fmtPct(tot)}</b></td></tr>`;
  }).join('');
  const simRows = S.sims.slice(0, 30).map(x => `<tr><td>${fmtD(x.date)}</td><td class="n">${x.n}</td><td class="n ok">${x.c}</td><td class="n bad">${x.w}</td><td class="n">${x.b}</td><td class="n"><b>${pct(x.c, x.n)}%</b></td><td class="n">${x.min} min${x.timeout ? ' (esgotou)' : ''}</td></tr>`).join('');
  const erros = D.erros.slice(0, 40).map(e => `<tr><td>${fmtD(e.d)}${e.kind === 'sim' ? '<br><small>simulado</small>' : ''}</td><td>${esc(e.q.a)}<br><small>${esc(e.q.t)}</small></td><td><small>${esc(corta(e.q.x, 150))}</small><br><b>${esc(e.q.q)}</b></td><td class="bad">${e.marcou ? esc(e.marcou) : '—'}${e.pegadinha ? ' <span class="tag">pegadinha</span>' : ''}</td><td class="ok">${esc(e.q.al[e.q.c])}</td></tr>`).join('');
  const repetidas = D.maisErradas.map(x => `<tr><td>${esc(x.q.a)} · ${esc(x.q.t)}<br><small>${esc(x.q.q)}</small></td><td class="n">${x.e}</td><td class="n">${x.n}</td></tr>`).join('');
  const provas = D.provas.map(p => `<h3>${p.nome} <small>· tema central: ${esc(p.tema)}</small></h3><p>${p.ok} de ${p.n} questões corrigidas certas (${fmtPct(acc(p.ok, p.n))}).</p>${p.errs.length ? `<div class="chips">${p.errs.map(x => `<span>Q${pad(x.q)} · ${esc(x.mat)} · marcou ${esc(x.marcou)}, certa ${x.certa}</span>`).join('')}</div>` : '<p class="ok">Nenhum erro nos blocos corrigidos.</p>'}`).join('');
  const sessoes = S.ses.slice(-25).reverse().map(s => `<tr><td>${fmtD(s.d)}</td><td>${s.k === 'sim' ? 'Simulado' : s.k === 'rev' ? 'Revisão' : 'Sessão do dia'}</td><td class="n">${s.n}</td><td class="n">${s.ok}</td><td class="n">${fmtPct(acc(s.ok, s.n))}</td><td class="n">${s.min} min</td></tr>`).join('');
  const dados = JSON.stringify({app:'Fatec em 30 minutos', versao:1, gerado:agora.toISOString(), nome:S.nome || '', estado:S}).replace(/</g, '\\u003c');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatório Fatec 30 · ${nome}</title><style>${REL_CSS}</style></head><body>
<h1>Relatório de estudo · ${nome}</h1>
<p class="meta">Vestibular Fatec, prova em 13/12/2026 · gerado em ${quando} pelo app Fatec em 30 minutos</p>
<div class="tiles">${tile(D.diasEst, 'dias estudados')}${tile(D.seq, 'dias seguidos agora')}${tile(D.tq, `questões do app · ${fmtPct(acc(D.tok, D.tq))} de acerto`)}${tile(D.tp, `questões de prova oficial · ${fmtPct(acc(D.tpok, D.tp))} de acerto`)}${tile(D.redacoes.length, 'treinos de redação')}${tile(D.rev, 'questões para revisar')}</div>
<div class="note"><b>Leitura rápida</b><ul>${relLeitura(D).map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
<h2>Evolução semana a semana</h2>
${tabela('<th>Semana</th><th class="n">Dias</th><th class="n">Questões app</th><th class="n">Acerto</th><th class="n">Prova oficial</th><th class="n">Acerto</th><th class="n">Redações</th><th class="n">Tendência</th>', semanas, 'Ainda sem dias de estudo registrados.')}
<h2>Simulados do app</h2>
<p class="meta">3 questões de cada matéria (ou 1 de cada, na versão rápida), 3 minutos por questão.</p>
${tabela('<th>Data</th><th class="n">Questões</th><th class="n">Certas</th><th class="n">Erradas</th><th class="n">Branco</th><th class="n">Acerto</th><th class="n">Tempo</th>', simRows, 'Nenhum simulado feito ainda.')}
<h2>Acerto por matéria</h2>
${tabela('<th>Matéria</th><th class="n">Na prova</th><th class="n">App</th><th class="n">Acerto</th><th class="n">Prova oficial</th><th class="n">Acerto</th><th class="n">Total</th>', mats, '')}
<h2>Questões do app que errou</h2>
<p class="meta">As mais recentes primeiro. "Pegadinha" quer dizer que marcou a alternativa feita para enganar.</p>
${tabela('<th>Data</th><th>Matéria</th><th>Questão</th><th>Marcou</th><th>Certa</th>', erros, 'Nenhum erro registrado ainda.')}
${D.errosSemLog.length ? `<p class="meta">Também errou na última tentativa, antes de o relatório existir: ${D.errosSemLog.map(q => esc(q.a + ' · ' + q.t)).join('; ')}.</p>` : ''}
${repetidas ? `<h3>Questões que errou mais de uma vez</h3>${tabela('<th>Questão</th><th class="n">Erros</th><th class="n">Tentativas</th>', repetidas, '')}` : ''}
<h2>Provas oficiais</h2>
${provas || '<p class="meta">Nenhum bloco de prova oficial corrigido ainda.</p>'}
<h2>Redação</h2>
<p>${D.redacoes.length ? 'Treinos completos em: ' + D.redacoes.map(fmtD).join(', ') + '.' : 'Nenhum treino de redação completo ainda.'}</p>
<h2>Sessões recentes</h2>
${tabela('<th>Data</th><th>Tipo</th><th class="n">Questões</th><th class="n">Certas</th><th class="n">Acerto</th><th class="n">Tempo</th>', sessoes, 'Nenhuma sessão registrada ainda.')}
<footer>Os dados completos estão guardados dentro deste arquivo, para análise. Material de estudo independente, sem vínculo com a Fatec.</footer>
<script type="application/json" id="dados-brutos">${dados}<\/script>
</body></html>`;
}
function relTexto(){
  const D = relDados(), L = [];
  L.push(`Relatório Fatec 30 · ${S.nome || 'Estudante'} · ${fmtD(D.t)}`);
  L.push(`Dias estudados: ${D.diasEst} (seguidos agora: ${D.seq}; nos últimos 7 dias: ${D.ult7})`);
  L.push(`Questões do app: ${D.tq}, acerto ${fmtPct(acc(D.tok, D.tq))}`);
  L.push(`Provas oficiais: ${D.tp} questões, acerto ${fmtPct(acc(D.tpok, D.tp))}`);
  L.push(`Treinos de redação: ${D.redacoes.length}`);
  if (S.sims.length) L.push(`Simulados: ${S.sims.length}; último: ${S.sims[0].c} de ${S.sims[0].n} (${pct(S.sims[0].c, S.sims[0].n)}%)`);
  const m = AREAS.map(a => { const b = D.by[a]; return {a, n:b.an + b.pn, p:acc(b.aok + b.pok, b.an + b.pn)}; }).filter(x => x.n);
  if (m.length){ L.push('', 'Por matéria:'); m.forEach(x => L.push(`- ${x.a}: ${x.p}% (${x.n} questões)`)); }
  if (D.semanas.length){ L.push('', 'Semana a semana:'); D.semanas.slice(-6).forEach(s => L.push(`- ${fmtD(s.w)}: ${s.dias} dias, ${s.q + s.pr} questões, ${fmtPct(acc(s.ok + s.prok, s.q + s.pr))}`)); }
  if (D.erros.length){ L.push('', 'Erros recentes:'); D.erros.slice(0, 8).forEach(e => L.push(`- ${e.q.a} · ${e.q.t}: marcou "${limpa(e.marcou) || '?'}", certa "${e.q.al[e.q.c]}"${e.pegadinha ? ' (pegadinha)' : ''}`)); }
  return L.join('\n');
}
function relArquivo(){
  const slug = (S.nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  return new File([relHTML()], `relatorio-fatec${slug ? '-' + slug : ''}-${today()}.html`, {type:'text/html'});
}
function relEnviar(){
  const st = $('#rel-status'), f = relArquivo();
  const baixar = () => {
    const u = URL.createObjectURL(f), a = document.createElement('a');
    a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    st.textContent = `Arquivo ${f.name} gerado. No iPhone ele fica no app Arquivos, em Downloads. Se nada apareceu, use "Copiar resumo em texto".`;
  };
  if (navigator.canShare && navigator.canShare({files:[f]})){
    navigator.share({files:[f], title:'Relatório Fatec 30'})
      .then(() => { st.textContent = 'Pronto: o relatório foi para o app que você escolheu.'; })
      .catch(e => { if (e && e.name === 'AbortError') st.textContent = 'Envio cancelado.'; else baixar(); });
  } else baixar();
}
function relCopiar(){
  const txt = relTexto(), st = $('#rel-status');
  const mostrar = () => { st.innerHTML = 'Copie o texto abaixo:<textarea class="reltxt" readonly aria-label="Resumo do relatório"></textarea>'; const ta = st.querySelector('textarea'); ta.value = txt; ta.focus(); ta.select(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { st.textContent = 'Resumo copiado. É só colar no WhatsApp.'; }, mostrar);
  else mostrar();
}
function cardRelatorio(){
  return `<section class="card"><p class="eyebrow">Relatório</p><h2 class="h-sm">Mandar meu progresso para quem me ajuda</h2>
    <p class="meta">Gera um arquivo com a evolução semana a semana, o acerto por matéria, as questões que você errou e as provas oficiais corrigidas. Dá para mandar pelo WhatsApp.</p>
    <div class="row"><label for="nome" class="meta">Seu nome</label><input type="text" id="nome" value="${esc(S.nome || '')}" placeholder="opcional" autocomplete="given-name" maxlength="40"></div>
    <button class="primary" data-act="rel-enviar">Enviar relatório</button>
    <button class="link" data-act="rel-copiar">Copiar resumo em texto</button>
    <div class="meta" id="rel-status" aria-live="polite"></div></section>`;
}

function render(){
  const full = !!(sess || sim);
  nav.hidden = full;
  app.innerHTML = sess ? (sess.end ? viewEnd() : viewQuiz())
    : sim ? (sim.end ? viewSimEnd() : viewSim())
    : tab === 'hoje' ? viewHome() : tab === 'provas' ? viewProvas() : tab === 'padroes' ? viewPadroes() : viewProgresso();
  nav.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-current', !full && b.dataset.tab === tab ? 'page' : 'false'));
  tick();
}
function fmtLeft(t0, dur){ const rem = dur - Math.floor((Date.now() - t0) / 1000); return rem <= 0 ? 'tempo ✓' : Math.floor(rem / 60) + ':' + pad(rem % 60); }
function tick(){
  if (sim && !sim.end && sim.auto && Date.now() - sim.t0 >= sim.dur * 1000){ finishSim(true); render(); scrollTo(0, 0); return; }
  document.querySelectorAll('.timer[data-t0]').forEach(el => { el.textContent = fmtLeft(+el.dataset.t0, +el.dataset.dur); });
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb){ tab = tb.dataset.tab; resetArm = false; render(); scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'start'){
    const f = FOCO[parseKey(today()).getDay()];
    startSession(+b.dataset.n || 8, f ? f.areas : [], !!b.dataset.rev);
  } else if (act === 'pick'){
    if (sess.revealed) return;
    sess.chosen = +b.dataset.o;
    app.querySelectorAll('.alt').forEach(el => { const on = +el.dataset.o === sess.chosen; el.classList.toggle('sel', on); el.setAttribute('aria-pressed', on); });
    $('#confirmar').disabled = false;
  } else if (act === 'confirm'){
    if (sess.chosen == null || sess.revealed) return;
    const q = QM[sess.ids[sess.i]], ok = sess.chosen === q.c;
    sess.revealed = true; sess.res.push({id:q.id, ok}); record(q, ok, sess.chosen); render();
  } else if (act === 'next'){
    sess.i++;
    if (sess.i >= sess.ids.length){ sess.end = true; closeSess(); }
    else { sess.chosen = null; sess.revealed = false; newPerm(); }
    render(); scrollTo(0, 0);
  } else if (act === 'quit'){
    if (sess.res.length){ sess.end = true; closeSess(); } else sess = null;
    render(); scrollTo(0, 0);
  } else if (act === 'home'){
    sess = null; tab = 'hoje'; render(); scrollTo(0, 0);
  } else if (act === 'ed-open'){
    provaSel = {id:b.dataset.id, from:1, to:10, t0:Date.now()}; render(); scrollTo(0, 0);
  } else if (act === 'sun-open'){
    tab = 'provas'; provaSel = {id:SUNDAY_ED, from:+b.dataset.f, to:+b.dataset.t, t0:Date.now()}; render(); scrollTo(0, 0);
  } else if (act === 'ed-back'){
    provaSel = null; render(); scrollTo(0, 0);
  } else if (act === 'blk'){
    provaSel.from = +b.dataset.f; provaSel.to = +b.dataset.t; provaSel.t0 = Date.now(); render();
  } else if (act === 'mark'){
    const st = prState(provaSel.id), q = +b.dataset.q, l = b.dataset.l;
    if (st.c[q]) return;
    if (st.a[q] === l) delete st.a[q]; else st.a[q] = l;
    save();
    b.closest('.crow').querySelectorAll('.bub-btn').forEach(x => { const on = x.dataset.l === st.a[q]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    const c = $('#corrigir'); if (c) c.disabled = false;
  } else if (act === 'corrigir'){
    const e = edById(provaSel.id), st = prState(e.id); let n = 0, ok = 0;
    for (let q = provaSel.from; q <= provaSel.to; q++){ if (st.c[q]) continue; st.c[q] = today(); n++; if (isRight(e, q, st.a[q])) ok++; }
    bumpDay('pr', ok, n); save(); render();
    const r = $('#res'); if (r) r.scrollIntoView({block:'start'});
  } else if (act === 'refazer'){
    const st = prState(provaSel.id);
    for (let q = provaSel.from; q <= provaSel.to; q++){ delete st.a[q]; delete st.c[q]; }
    provaSel.t0 = Date.now(); save(); render();
  } else if (act === 'fsim'){
    startSim(+b.dataset.n || 3);
  } else if (act === 'fs-pick'){
    const id = sim.ids[sim.i], o = +b.dataset.o;
    if (sim.ans[id] === o) delete sim.ans[id]; else sim.ans[id] = o;
    app.querySelectorAll('.alt').forEach(x => { const on = +x.dataset.o === sim.ans[id]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    const pr = app.querySelector('.qprog span'); if (pr) pr.textContent = `${sim.i + 1} de ${sim.ids.length} · ${Object.keys(sim.ans).length} marcadas`;
  } else if (act === 'fs-next' || act === 'fs-prev'){
    sim.i += act === 'fs-next' ? 1 : -1; render(); scrollTo(0, 0);
  } else if (act === 'fs-finish'){
    finishSim(false); render(); scrollTo(0, 0);
  } else if (act === 'fs-quit'){
    sim = null; render(); scrollTo(0, 0);
  } else if (act === 'fs-close'){
    sim = null; tab = 'provas'; render(); scrollTo(0, 0);
  } else if (act === 'rel-enviar'){
    relEnviar();
  } else if (act === 'rel-copiar'){
    relCopiar();
  } else if (act === 'reset'){
    if (!resetArm){ resetArm = true; b.textContent = 'Toque de novo para apagar tudo'; setTimeout(() => { resetArm = false; const r = $('#reset'); if (r) r.textContent = 'Apagar meu progresso'; }, 4000); }
    else { S = fresh(); save(); resetArm = false; render(); }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'auto-end'){ S.autoEnd = el.checked; save(); return; }
  if (el.dataset && el.dataset.red != null){
    const t = today(), r = S.red[t] || [false, false, false];
    r[+el.dataset.red] = el.checked; S.red[t] = r; save(); render();
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'nome'){ S.nome = ev.target.value.trim().slice(0, 40); save(); }
});

render();
setInterval(tick, 1000);
</script>

</body>
